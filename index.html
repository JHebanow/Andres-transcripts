<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrés' Transcripts</title>
<meta name="description" content="Transcripts of Andrés Gómez-Emilsson's talks (Qualia Research Institute), with figures and synced video.">
<meta property="og:title" content="Andrés' Transcripts">
<meta property="og:description" content="Transcripts of Andrés Gómez-Emilsson's talks (Qualia Research Institute), with figures and synced video.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.qri.org/images/qrilogo.PNG">
<meta name="twitter:card" content="summary">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js"></script>
<style>
  :root{
    --bg:#faf9f6; --fg:#1e2226; --muted:#6b7280; --accent:#7c5cbf; --accent-soft:#7c5cbf22;
    --card:#ffffff; --border:#e5e2da; --hl:#f3eefc; --img-bg:transparent; --flash:#ffe06699;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171a; --fg:#e6e4df; --muted:#9aa0a8; --accent:#b39ae8; --accent-soft:#b39ae822;
      --card:#1d2024; --border:#2c3036; --hl:#25203180; --img-bg:#f5f3ee; --flash:#8a6d0099;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171a; --fg:#e6e4df; --muted:#9aa0a8; --accent:#b39ae8; --accent-soft:#b39ae822;
    --card:#1d2024; --border:#2c3036; --hl:#25203180; --img-bg:#f5f3ee; --flash:#8a6d0099;
  }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font-family:"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size:1.06rem; line-height:1.65; }
  a{ color:var(--accent); }
  button{ font-family:system-ui,sans-serif; }
  mark{ background:var(--flash); color:inherit; border-radius:3px; padding:0 .05em; }

  header.site{ padding:.65rem 1.2rem; border-bottom:1px solid var(--border);
        display:flex; align-items:center; gap:.7rem; font-family:system-ui, sans-serif;
        position:sticky; top:0; background:var(--bg); z-index:100; flex-wrap:wrap; }
  header.site img.logo{ height:30px; width:auto; display:block; }
  header.site a.home{ font-weight:700; text-decoration:none; color:var(--fg); font-size:1.02rem;
        margin-right:.4rem; }
  header.site .spacer{ flex:1 }
  .btn{ font-size:.82rem; padding:.32rem .8rem; border-radius:20px; cursor:pointer;
        border:1px solid var(--border); background:var(--card); color:var(--fg);
        text-decoration:none; display:inline-block; }
  .btn:hover{ border-color:var(--accent); }
  .btn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .ok{ color:var(--accent); font-size:.82rem; display:none; }

  /* ---------- search ---------- */
  .searchWrap{ position:relative; }
  #searchBox{ font:inherit; font-size:.85rem; font-family:system-ui,sans-serif;
        padding:.32rem .8rem; border-radius:20px; border:1px solid var(--border);
        background:var(--card); color:var(--fg); width:170px; transition:width .2s; }
  #searchBox:focus{ width:240px; outline:none; border-color:var(--accent); }
  #searchResults{ position:absolute; top:calc(100% + 6px); right:0; width:min(500px, 92vw);
        max-height:65vh; overflow:auto; background:var(--card); border:1px solid var(--border);
        border-radius:12px; box-shadow:0 8px 30px #0005; display:none; z-index:200;
        font-family:system-ui,sans-serif; }
  #searchResults .g{ padding:.45rem .9rem .2rem; font-size:.72rem; letter-spacing:.06em;
        text-transform:uppercase; color:var(--muted); font-weight:600; }
  #searchResults .r{ display:block; padding:.45rem .9rem; cursor:pointer; font-size:.86rem;
        line-height:1.45; border-top:1px solid var(--border); color:var(--fg); }
  #searchResults .r:hover{ background:var(--accent-soft); }
  #searchResults .none{ padding:.8rem .9rem; color:var(--muted); font-size:.86rem; }

  .wrap{ max-width:760px; margin:0 auto; padding:1.5rem 1.2rem 5rem; }

  /* ---------- list (landing) page: compact list ---------- */
  .wrap.list{ max-width:820px; }
  ul.notelist{ list-style:none; padding:0; margin:1rem 0 2rem;
        border:1px solid var(--border); border-radius:12px; background:var(--card);
        overflow:hidden; }
  ul.notelist li + li{ border-top:1px solid var(--border); }
  ul.notelist li.yhead{ font-family:system-ui,sans-serif; font-size:.72rem;
        letter-spacing:.1em; text-transform:uppercase; font-weight:600;
        color:var(--muted); padding:.55rem 1rem .35rem; background:var(--bg); }
  ul.notelist a{ display:flex; align-items:center; gap:.9rem; padding:.55rem .9rem;
        text-decoration:none; color:var(--fg); }
  ul.notelist a:hover{ background:var(--accent-soft); }
  ul.notelist .thumb{ flex:0 0 96px; width:96px; aspect-ratio:16/9; object-fit:cover;
        border-radius:6px; background:#000; }
  ul.notelist .tile{ min-width:0; flex:1; display:flex; align-items:center; gap:.9rem; }
  ul.notelist .t{ flex:1; font-weight:600; font-size:.98rem; line-height:1.35; }
  ul.notelist .nd{ font-family:system-ui,sans-serif; font-size:.75rem; color:var(--muted);
        white-space:nowrap; text-align:right; flex:0 0 auto; }
  ul.notelist .badge{ display:none; }
  @media (max-width:560px){
    ul.notelist .thumb{ flex-basis:72px; width:72px; }
    ul.notelist .t{ font-size:.9rem; }
    ul.notelist .nd{ display:none; }
  }
  .sortbar{ display:flex; justify-content:flex-end; margin-top:1.4rem; font-family:system-ui,sans-serif; }
  /* date sits in a gutter left of the link block, not inside the text flow */
  nav.files a{ position:relative; margin-left:58px; }
  nav.files a .d{ position:absolute; left:-58px; top:.45rem; width:50px; text-align:right;
        color:var(--muted); font-size:.66rem; font-family:system-ui,sans-serif;
        white-space:nowrap; pointer-events:none; }
  .nsort{ font-family:system-ui,sans-serif; font-size:.75rem; border:1px solid var(--border);
        background:var(--card); color:var(--muted); border-radius:6px; cursor:pointer;
        padding:0 .45rem; margin-left:.5rem; line-height:1.4; vertical-align:middle; }
  .nsort:hover{ color:var(--accent); border-color:var(--accent); }
  .badge{ display:inline-block; font-family:system-ui,sans-serif; font-size:.72rem;
        color:var(--accent); background:var(--accent-soft); border-radius:20px;
        padding:.1rem .6rem; margin-top:.4rem; margin-right:.4rem; }

  /* ---------- 3-panel article layout ---------- */
  .layout{ display:grid; grid-template-columns:240px minmax(0,760px) 320px;
        gap:2.2rem; justify-content:center; max-width:1420px; margin:0 auto;
        padding:1.5rem 1.2rem 5rem; align-items:start;
        transition:margin-right .35s ease; }
  body.sync .layout{ grid-template-columns:220px minmax(0,720px) var(--sidew, 430px);
        max-width:none; }   /* let the whole grid slide left before anything shrinks */

  nav.files{ position:sticky; top:4rem; font-family:system-ui,sans-serif; font-size:.86rem;
        max-height:calc(100vh - 5.5rem); overflow:auto; }
  nav.files h4, .sidePanel h4{ margin:.2rem 0 .5rem; font-size:.72rem; letter-spacing:.08em;
        text-transform:uppercase; color:var(--muted); font-weight:600; }
  nav.files a{ display:block; padding:.4rem .6rem; border-radius:8px; text-decoration:none;
        color:var(--fg); margin-bottom:2px; border-left:3px solid transparent; }
  nav.files a:hover{ background:var(--accent-soft); }
  nav.files a.cur{ background:var(--accent-soft); border-left-color:var(--accent); font-weight:600; }
  /* faint preview highlight while hovering a cross-link in the text */
  nav.files a.peek{ background:color-mix(in srgb, var(--accent) 8%, transparent);
        border-left-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  article a.xref{ text-decoration-style:dotted; text-underline-offset:2px; }

  .sidePanel{ position:sticky; top:4rem; font-family:system-ui,sans-serif;
        max-height:calc(100vh - 5.5rem); display:flex; flex-direction:column; min-height:0; }
  .sidePanel .toc{ overflow:auto; min-height:0; flex:1 1 auto; }
  .videoPanel .frame, .videoPanel .controls, .videoPanel .vtabs{ flex:0 0 auto; }
  .vtabs{ display:flex; gap:.4rem; margin-bottom:.55rem; }
  .sideRsz{ position:absolute; left:-17px; top:0; bottom:0; width:14px; cursor:ew-resize;
        display:flex; align-items:center; justify-content:center; touch-action:none; }
  .sideRsz::after{ content:''; width:4px; height:34px; border-radius:2px; background:var(--border); }
  .sideRsz:hover::after{ background:var(--accent); }
  body.dragging-side{ user-select:none; cursor:ew-resize; }
  body.dragging-side iframe{ pointer-events:none; }
  .toc a{ display:block; padding:.28rem .6rem; border-radius:6px; font-size:.85rem;
        color:var(--muted); text-decoration:none; border-left:3px solid transparent; }
  .toc a.h3{ padding-left:1.5rem; font-size:.8rem; }
  .toc a:hover{ color:var(--fg); background:var(--accent-soft); }
  .toc a.cur{ color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .toc .t{ font-size:.68rem; color:var(--muted); margin-left:.4rem; }

  .videoPanel .frame{ position:relative; width:100%; aspect-ratio:16/9; background:#000;
        border-radius:10px; overflow:hidden; }
  .videoPanel .frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .videoPanel .controls{ display:flex; gap:.6rem; margin:.6rem 0 1rem; align-items:center; flex-wrap:wrap; }
  .videoPanel .now{ font-size:.82rem; color:var(--muted); }

  /* ---------- article ---------- */
  article h1{ font-size:1.7rem; line-height:1.3; margin:.6rem 0 1.2rem; }
  article h2{ font-size:1.28rem; margin-top:2.2rem; }
  article h3{ font-size:1.1rem; }
  article img{ max-width:100%; height:auto; display:block; margin:1.4rem auto;
        background:var(--img-bg); border-radius:8px; padding:6px; cursor:zoom-in; }
  article hr{ border:none; border-top:1px solid var(--border); margin:2rem 0; }
  article blockquote{ border-left:3px solid var(--accent); margin:1rem 0; padding:.1rem 1rem;
        color:var(--muted); }

  /* dialogue: one accent colour per speaker, one continuous line per turn */
  article .turn{ border-left:3px solid var(--spk, var(--border)); padding:.1rem 0 .1rem .85rem;
        margin:1.05rem 0; }
  article .turn > *:first-child{ margin-top:0; }
  article .turn > *:last-child{ margin-bottom:0; }
  article .turn .who{ color:var(--spk); font-weight:700; }
  article .turn img{ margin-left:0; }
  .footnotes{ font-size:.9rem; color:var(--muted); }
  sup.footnote-ref a{ text-decoration:none; padding:0 .1em; }

  @keyframes flashbg{ 0%{background-color:var(--flash)} 100%{background-color:transparent} }
  .flash{ animation:flashbg 2.2s ease-out; border-radius:4px; }

  h2.stamped, h3.stamped{ cursor:pointer; }
  h2.stamped:hover .chip, h3.stamped:hover .chip{ background:var(--accent); color:#fff; }
  .chip{ font-family:system-ui,sans-serif; font-size:.72rem; font-weight:400; vertical-align:middle;
        color:var(--accent); background:var(--accent-soft); border-radius:20px;
        padding:.12rem .55rem; margin-left:.55rem; white-space:nowrap; }
  section.chunk{ border-left:3px solid transparent; margin-left:-1rem; padding-left:1rem;
        transition:background .4s, border-color .4s; border-radius:4px; }
  section.chunk.active{ background:var(--hl); border-left-color:var(--accent); }

  /* ---------- footnote hover preview ---------- */
  #fnpop{ position:fixed; z-index:300; max-width:400px; background:var(--card);
        border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 24px #0004;
        padding:.7rem .9rem; font-size:.86rem; line-height:1.5; color:var(--fg);
        display:none; overflow:auto; max-height:45vh; }
  #fnpop p{ margin:.3rem 0; }

  /* ---------- image lightbox ---------- */
  #lightbox{ position:fixed; inset:0; z-index:400; display:none; align-items:center;
        justify-content:center; background:#000a; backdrop-filter:blur(6px); cursor:zoom-out; }
  #lightbox.open{ display:flex; }
  #lightbox img{ max-width:92vw; max-height:92vh; background:#f5f3ee; border-radius:10px; padding:10px; }

  /* wide video panel sacrifices the transcript list when space runs out */
  body.hide-nav nav.files{ display:none !important; }
  body.sync.hide-nav .layout{ grid-template-columns:minmax(0,720px) var(--sidew, 430px); }

  /* section link chips */
  .lnk{ font-family:system-ui,sans-serif; font-size:.78rem; margin-left:.5rem; opacity:0;
        cursor:pointer; color:var(--accent); transition:opacity .15s; user-select:none; }
  h2:hover .lnk, h3:hover .lnk, .lnk:hover{ opacity:.85; }

  /* download menu */
  .dlWrap{ position:relative; display:inline-block; }
  .dlMenu{ position:absolute; top:calc(100% + 4px); left:0; background:var(--card);
        border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 20px #0004;
        display:none; z-index:210; min-width:190px; overflow:hidden; }
  .dlMenu.open{ display:block; }
  .dlMenu button{ display:block; width:100%; text-align:left; padding:.5rem .9rem;
        background:none; border:none; color:var(--fg); cursor:pointer; font-size:.84rem; }
  .dlMenu button:hover{ background:var(--accent-soft); }

  /* print / save-as-PDF */
  @media print{
    :root, :root[data-theme="dark"]{ --bg:#fff; --fg:#000; --muted:#444; --border:#bbb;
        --img-bg:transparent; --accent:#000; --accent-soft:transparent; --hl:transparent; }
    header.site, nav.files, .sidePanel, #resume, #fnpop, #lightbox, .chip, .lnk{ display:none !important; }
    body{ background:#fff !important; color:#000 !important; font-size:11pt; }
    .layout, body.sync .layout{ display:block; margin:0 !important; padding:0; max-width:none; }
    section.chunk{ border:none; margin-left:0; padding-left:0; background:none !important; }
    article img{ padding:0; background:#fff; page-break-inside:avoid; }
    article a, sup.footnote-ref a{ color:#000; }
  }

  /* ---------- continue-reading chip ---------- */
  #resume{ position:fixed; left:50%; bottom:1.2rem; transform:translate(-50%, 5rem);
        transition:transform .3s ease; z-index:150; font-family:system-ui,sans-serif;
        background:var(--card); border:1px solid var(--border); color:var(--fg);
        border-radius:24px; padding:.5rem 1.1rem; font-size:.86rem; cursor:pointer;
        box-shadow:0 6px 20px #0004; }
  #resume.show{ transform:translate(-50%, 0); }
  #resume:hover{ border-color:var(--accent); }

  /* ---------- mobile drawers ---------- */
  .drawerTab{ display:none; position:fixed; top:42%; z-index:205; padding:.9rem .32rem;
        font-family:system-ui,sans-serif; font-size:.72rem; letter-spacing:.06em;
        writing-mode:vertical-rl; text-orientation:mixed; cursor:pointer;
        background:var(--card); color:var(--muted); border:1px solid var(--border); }
  .drawerTab.left{ left:0; border-left:none; border-radius:0 8px 8px 0; }
  .drawerTab.right{ right:0; border-right:none; border-radius:8px 0 0 8px; transform:rotate(180deg); }
  #backdrop{ display:none; position:fixed; inset:0; background:#0007; z-index:210; }
  body.dL #backdrop, body.dR #backdrop{ display:block; }

  @media (max-width:1180px){
    .layout, body.sync .layout{ display:block; max-width:800px; }
    .sideRsz{ display:none; }
    body.article .drawerTab{ display:block; }

    /* left drawer: transcript list */
    nav.files{ display:block; position:fixed; left:0; top:0; bottom:0; z-index:220;
        width:min(78vw, 320px); max-height:none; background:var(--bg);
        border-right:1px solid var(--border); padding:1.2rem 1rem;
        transform:translateX(-105%); transition:transform .28s ease; overflow:auto; }
    body.dL nav.files{ transform:none; }

    /* right drawer: chapters */
    .sidePanel{ position:static; display:block; max-height:none; margin-bottom:1rem; }
    .sidePanel .toc{ position:fixed; right:0; top:0; bottom:0; z-index:220;
        width:min(78vw, 320px); background:var(--bg); border-left:1px solid var(--border);
        padding:1.2rem 1rem; transform:translateX(105%); transition:transform .28s ease;
        overflow:auto; }
    body.dR .sidePanel .toc{ transform:none; }

    /* split screen: video docked at the top, collapsible */
    body.sync .videoPanel{ position:sticky; top:3.2rem; z-index:50; background:var(--bg);
        padding:.4rem 0; }
    body.sync .videoPanel .frame{ max-height:36vh; max-width:calc(36vh*16/9); margin:0 auto; }
    body.vhide .videoPanel .frame, body.vhide .videoPanel .vtabs{ display:none; }
    #vidToggle{ display:inline-block; }
  }
  #vidToggle{ display:none; }
  .err{ color:#c0392b; font-family:system-ui,sans-serif; }
  .loading{ color:var(--muted); font-family:system-ui,sans-serif; }
</style>
</head>
<body>
<header class="site">
  <img class="logo" id="logo" src="illustrations/logo.png" alt="QRI"
       onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://qri.org/images/logo.webp';}else{this.style.display='none';}">
  <a class="home" href="#/" id="homeLink">Andrés' Transcripts</a>
  <span id="pageActions" style="display:contents"></span>
  <span class="spacer"></span>
  <span class="searchWrap">
    <input id="searchBox" type="search" placeholder="Search transcripts…" autocomplete="off">
    <div id="searchResults"></div>
  </span>
  <button class="btn" id="themeBtn" title="Toggle light/dark mode">🌙 Dark</button>
</header>
<div id="app"><p class="loading wrap">Loading…</p></div>
<div id="fnpop"></div>
<div id="lightbox"><img alt=""></div>
<button id="resume">↩ Continue where you left off</button>
<button class="drawerTab left" id="drawerL" title="Transcripts">☰ Transcripts</button>
<button class="drawerTab right" id="drawerR" title="Chapters">☰ Chapters</button>
<div id="backdrop"></div>

<script>
"use strict";
/* ================= state ================= */
const BUST = Date.now();          // cache-buster for illustrations
let manifest = null, md = null, player = null, pollTimer = null;
let sections = [], tocItems = [];
let follow = true, suppressScrollSense = 0, scrollAnim = null;
let curSrc = '', curNote = null;
let searchIndex = null, searchResults = [], pendingJump = null;
let resumeTimer = null, posSaveTimer = null;
let pendingSeek = null;               // {t, v} deep link waiting for the player
let sidePx = +localStorage.getItem('sidew') || 0;
let curVids = [], activeVid = 0;      // videos of the current note; active tab
let ytReady = false;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };

/* ================= theme ================= */
function effectiveTheme(){
  const set = document.documentElement.getAttribute('data-theme');
  if (set) return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyThemeBtn(){
  document.getElementById('themeBtn').textContent =
    effectiveTheme() === 'dark' ? '☀️ Light' : '🌙 Dark';
}
(function initTheme(){
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  applyThemeBtn();
  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    applyThemeBtn();
  });
})();

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => {
  t = Math.max(0, Math.floor(t));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
};
const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const slugify = s => norm(s).replace(/ /g,'-');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d, short){
  if (!d) return '';
  const [y,m,day] = d.split('-').map(Number);
  return short ? MONTHS[m-1] + ' ' + y : MONTHS[m-1] + ' ' + day + ', ' + y;
}
function sortedNotes(){
  const dir = (localStorage.getItem('sortOrder') || 'oldest') === 'oldest' ? 1 : -1;
  return [...manifest.notes].sort((a,b) => ((a.date||'') < (b.date||'') ? -1 : 1) * dir);
}
function navInner(curSlug){
  const order = localStorage.getItem('sortOrder') || 'oldest';
  let h = '<h4>Transcripts <button class="nsort" id="navSort" title="'
        + (order === 'oldest' ? 'Sorted oldest first — click for newest first' : 'Sorted newest first — click for oldest first')
        + '">' + (order === 'oldest' ? '↑' : '↓') + '</button></h4>';
  for (const n of sortedNotes())
    h += '<a href="#/' + esc(n.slug) + '"' + (n.slug === curSlug ? ' class="cur"' : '') + '>'
       + (n.date ? '<span class="d">' + fmtDate(n.date, true) + '</span>' : '')
       + esc(n.title.split(':')[0]) + '</a>';
  return h;
}
/* links to other transcripts on this site: hovering one previews it in the left panel */
function markCrossLinks(){
  for (const a of document.querySelectorAll('#article a[href^="#/"]')){
    const slug = decodeURIComponent(a.getAttribute('href').slice(2));
    if (!manifest.notes.some(n => n.slug === slug)) continue;
    a.classList.add('xref');
    a.addEventListener('mouseenter', () => {
      const t = document.querySelector('nav.files a[href="#/' + CSS.escape(slug) + '"]');
      if (!t || t.classList.contains('cur')) return;
      t.classList.add('peek');
      t.scrollIntoView({block:'nearest'});
    });
    a.addEventListener('mouseleave', () =>
      document.querySelectorAll('nav.files a.peek').forEach(x => x.classList.remove('peek')));
  }
}

function attachNavSort(){
  const b = $('#navSort');
  if (!b) return;
  b.addEventListener('click', () => {
    const order = localStorage.getItem('sortOrder') || 'oldest';
    localStorage.setItem('sortOrder', order === 'oldest' ? 'newest' : 'oldest');
    const nav = document.querySelector('nav.files');
    if (nav && curNote){ nav.innerHTML = navInner(curNote.slug); attachNavSort(); }
  });
}

function preprocess(src, notesByTitle){
  src = src.replace(/!\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g, (m, target, alias) => {
    const t = target.trim();
    if (/\.(svg|png|jpe?g|gif|webp)$/i.test(t)){
      const file = t.includes('/') ? t : 'illustrations/' + t;
      return '<img src="' + esc(encodeURI(file)) + '?v=' + BUST + '" alt="' + esc(alias || t) + '">';
    }
    return alias || t;
  });
  src = src.replace(/(!\[[^\]]*\]\()([^)\/:]+\.(?:svg|png|jpe?g|gif|webp))(\))/gi,
    (m, a, f, z) => a + 'illustrations/' + f + '?v=' + BUST + z);
  src = src.replace(/\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g, (m, target, alias) => {
    const text = alias || target;
    const hit = notesByTitle[norm(target)];
    return hit ? '[' + text + '](#/' + hit.slug + ')' : text;
  });
  return src;
}

/* rAF smooth scroll: recomputes the target every frame, so images loading
   mid-scroll can't cause an offset or an end-of-scroll snap */
const HEADER_OFFSET = 74;
function smoothScrollTo(el){
  suppressScrollSense = Date.now() + 1400;
  cancelAnimationFrame(scrollAnim);
  const dur = 600, t0 = performance.now(), y0 = window.scrollY;
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    const yT = Math.max(0, window.scrollY + el.getBoundingClientRect().top - HEADER_OFFSET);
    window.scrollTo(0, y0 + (yT - y0) * e);
    if (p < 1) scrollAnim = requestAnimationFrame(tick);
  };
  scrollAnim = requestAnimationFrame(tick);
}
function flash(el){
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 2400);
}

/* ================= router ================= */
async function boot(){
  try{
    manifest = await (await fetch('manifest.json', {cache:'no-store'})).json();
  }catch(e){
    $('#app').innerHTML = '<p class="err wrap">Could not load manifest.json. If you opened this file directly from disk, run a local server (e.g. <code>python -m http.server</code>) or upload the folder to GitHub Pages.</p>';
    return;
  }
  document.title = manifest.site.title;
  $('#homeLink').textContent = manifest.site.title;
  md = window.markdownit({html:true, linkify:true, typographer:true}).use(window.markdownitFootnote);
  window.addEventListener('hashchange', route);
  initGlobalUI();
  route();
}

function route(){
  const h = location.hash;
  if (h && !h.startsWith('#/')) return;   // in-page anchor — let the browser handle it
  teardownPlayer();
  hideResume();
  closeDrawers();
  const raw = h.replace(/^#\/?/, '');
  const qi = raw.indexOf('?');
  const slug = decodeURIComponent(qi < 0 ? raw : raw.slice(0, qi));
  const params = new URLSearchParams(qi < 0 ? '' : raw.slice(qi + 1));
  const note = manifest.notes.find(n => n.slug === slug);
  if (note) renderNote(note, params); else renderList();
  window.scrollTo(0,0);
}

/* ================= video panel sizing ================= */
function sideWidth(){
  const def = 430;
  return Math.max(300, Math.min(sidePx || def, innerWidth - 640));
}
/* enlarging the panel first slides the whole grid left (centering margins shrink);
   once the transcript list would be pushed off the left edge, hide it;
   only after that does the article column itself start to shrink */
function applySideLayout(){
  document.documentElement.style.setProperty('--sidew', sideWidth() + 'px');
  const b = document.body;
  b.classList.remove('hide-nav');
  if (!b.classList.contains('sync') || innerWidth <= 1180) return;
  const fullGrid = 220 + 720 + sideWidth() + 108;   // nav + article + panel + gaps/padding
  if (innerWidth < fullGrid) b.classList.add('hide-nav');
}
function initSideResize(){
  const rsz = $('#sideRsz');
  if (!rsz) return;
  let dragX = null, dragW = null;
  rsz.addEventListener('pointerdown', e => {
    dragX = e.clientX; dragW = sideWidth();
    document.body.classList.add('dragging-side');
    rsz.setPointerCapture(e.pointerId);
  });
  rsz.addEventListener('pointermove', e => {
    if (dragX === null) return;
    sidePx = dragW + (dragX - e.clientX);
    applySideLayout();
  });
  rsz.addEventListener('pointerup', () => {
    if (dragX === null) return;
    dragX = null;
    document.body.classList.remove('dragging-side');
    try{ localStorage.setItem('sidew', String(sideWidth())); }catch(e){}
  });
  rsz.addEventListener('dblclick', () => {
    sidePx = 0;
    try{ localStorage.removeItem('sidew'); }catch(e){}
    applySideLayout();
  });
}

/* ================= full-text search ================= */
function stripMd(s){
  return s
    .replace(/!\[\[[^\]]*\]\]/g,' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
    .replace(/\[\^[^\]]+\]:?/g,' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g,(m,a,b)=>b||a)
    .replace(/[#*_`>]/g,'')
    .replace(/\s+/g,' ').trim();
}
async function ensureIndex(){
  if (searchIndex) return searchIndex;
  searchIndex = [];
  await Promise.all(manifest.notes.map(async n => {
    try{
      const src = await (await fetch(encodeURI(n.file), {cache:'no-store'})).text();
      for (const block of src.split(/\n\n+/)){
        const plain = stripMd(block);
        if (plain.length > 2) searchIndex.push({note:n, plain});
      }
    }catch(e){}
  }));
  return searchIndex;
}
function runSearch(q){
  const box = $('#searchResults');
  const ql = q.toLowerCase();
  searchResults = [];
  for (const b of searchIndex){
    const i = b.plain.toLowerCase().indexOf(ql);
    if (i < 0) continue;
    searchResults.push({b, i});
    if (searchResults.length >= 40) break;
  }
  if (!searchResults.length){
    box.innerHTML = '<div class="none">No matches for “' + esc(q) + '”</div>';
    box.style.display = 'block';
    return;
  }
  let html = '', lastSlug = null;
  searchResults.forEach((r, idx) => {
    if (r.b.note.slug !== lastSlug){
      html += '<div class="g">' + esc(r.b.note.title) + '</div>';
      lastSlug = r.b.note.slug;
    }
    const s = Math.max(0, r.i - 55), e = Math.min(r.b.plain.length, r.i + q.length + 55);
    const snip = (s > 0 ? '…' : '') + esc(r.b.plain.slice(s, r.i))
      + '<mark>' + esc(r.b.plain.slice(r.i, r.i + q.length)) + '</mark>'
      + esc(r.b.plain.slice(r.i + q.length, e)) + (e < r.b.plain.length ? '…' : '');
    html += '<span class="r" data-i="' + idx + '">' + snip + '</span>';
  });
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('.r').forEach(el => el.addEventListener('click', () => {
    const r = searchResults[+el.dataset.i];
    closeSearch();
    jumpToBlock(r.b.note, r.b.plain);
  }));
}
function closeSearch(){
  $('#searchResults').style.display = 'none';
}
function jumpToBlock(note, plain){
  if (curNote && curNote.slug === note.slug){ locateAndFlash(plain); return; }
  pendingJump = {slug: note.slug, plain};
  location.hash = '#/' + note.slug;
}
function locateAndFlash(plain){
  const needle = norm(plain).slice(0, 60);
  if (!needle) return;
  for (const el of document.querySelectorAll('#article p, #article li, #article h1, #article h2, #article h3, #article blockquote')){
    if (norm(el.textContent).includes(needle)){
      smoothScrollTo(el); flash(el); return;
    }
  }
}

/* ================= continue reading ================= */
function savePos(){
  if (!curNote || window.scrollY < 300) return;
  try{ localStorage.setItem('pos:' + curNote.slug, String(Math.round(window.scrollY))); }catch(e){}
}
function offerResume(note){
  let y = 0;
  try{ y = +localStorage.getItem('pos:' + note.slug) || 0; }catch(e){}
  if (y < 600) return;
  const r = $('#resume');
  r.classList.add('show');
  r.onclick = () => {
    hideResume();
    suppressScrollSense = Date.now() + 1400;
    window.scrollTo({top:y, behavior:'smooth'});

}

/* ================= global UI (once) ================= */
function closeDrawers(){ document.body.classList.remove('dL','dR'); }
function initGlobalUI(){
  window.addEventListener('resize', applySideLayout);

  // mobile drawers
  $('#drawerL').addEventListener('click', () => {
    const b = document.body;
    const open = b.classList.contains('dL');
    closeDrawers(); if (!open) b.classList.add('dL');
  });
  $('#drawerR').addEventListener('click', () => {
    const b = document.body;
    const open = b.classList.contains('dR');
    closeDrawers(); if (!open) b.classList.add('dR');
  });
  $('#backdrop').addEventListener('click', closeDrawers);
  // any navigation from inside a drawer closes it
  document.addEventListener('click', e => {
    if (e.target.closest('nav.files a, .toc a')) closeDrawers();
  });

  // close download menu on outside click
  document.addEventListener('click', e => {
    if (!e.target.closest('.dlWrap')){
      const m = $('#dlMenu'); if (m) m.classList.remove('open');
    }
  });

  // manual wheel cancels any programmatic smooth scroll
  window.addEventListener('wheel', () => cancelAnimationFrame(scrollAnim), {passive:true});
  window.addEventListener('touchmove', () => cancelAnimationFrame(scrollAnim), {passive:true});

  // save reading position (throttled)
  window.addEventListener('scroll', () => {
    if (posSaveTimer) return;
    posSaveTimer = setTimeout(() => { posSaveTimer = null; savePos(); }, 500);
  }, {passive:true});

  // search
  const sb = $('#searchBox');
  let searchT = null;
  sb.addEventListener('input', () => {
    clearTimeout(searchT);
    const q = sb.value.trim();
    if (q.length < 2){ closeSearch(); return; }
    searchT = setTimeout(async () => { await ensureIndex(); runSearch(q); }, 220);
  });
  sb.addEventListener('focus', () => { if (sb.value.trim().length >= 2) sb.dispatchEvent(new Event('input')); });
  document.addEventListener('click', e => {
    if (!e.target.closest('.searchWrap')) closeSearch();
  });

  // image lightbox
  const lb = $('#lightbox');
  document.addEventListener('click', e => {
    const img = e.target.closest('#article img');
    if (img){ lb.querySelector('img').src = img.src; lb.classList.add('open'); return; }
    if (e.target.closest('#lightbox')) lb.classList.remove('open');
  });

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      lb.classList.remove('open'); hideFnPop(0); closeSearch(); hideResume(); closeDrawers();
      return;
    }
    if (e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/'){ e.preventDefault(); sb.focus(); return; }
    if (!curNote) return;
    if (e.key === ' ' && player && player.getPlayerState){
      e.preventDefault();
      player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const secs = sections.filter(s => s.v === activeVid);
      if (player && secs.length && player.getCurrentTime){
        // seek to previous/next chapter in the video that is playing
        e.preventDefault();
        let t; try{ t = player.getCurrentTime(); }catch(err){ return; }
        let idx = -1;
        secs.forEach((s,i) => { if (s.t <= t + 0.5) idx = i; });
        const ni = Math.min(secs.length - 1, Math.max(0, idx + dir));
        player.seekTo(secs[ni].t, true); player.playVideo();
      } else if (tocItems.length){
        // scroll to previous/next chapter in the text
        e.preventDefault();
        let idx = -1;
        tocItems.forEach((it,i) => { if (it.head.getBoundingClientRect().top <= 120) idx = i; });
        const ni = Math.min(tocItems.length - 1, Math.max(0, idx + dir));
        smoothScrollTo(tocItems[ni].head);
      }
    }
  });

  // footnote jumps: smooth scroll + yellow flash, both directions
  document.addEventListener('click', e => {
    const a = e.target.closest('#article a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href.startsWith('#/')) return;
    const target = document.getElementById(decodeURIComponent(href.slice(1)));
    if (!target) return;
    e.preventDefault();
    hideFnPop(0);
    const block = target.closest('li') || target.closest('p') || target;
    smoothScrollTo(block);
    flash(block);
  });

  // footnote hover preview
  const pop = $('#fnpop');
  let hideT = null;
  const showFor = a => {
    const id = decodeURIComponent((a.getAttribute('href')||'').slice(1));
    const li = document.getElementById(id);
    if (!li) return;
    const clone = li.cloneNode(true);
    clone.querySelectorAll('.footnote-backref').forEach(x => x.remove());
    pop.innerHTML = clone.innerHTML;
    pop.style.display = 'block';
    const r = a.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 12)) + 'px';
    const below = r.bottom + 8, h = pop.offsetHeight;
    pop.style.top = (below + h > innerHeight - 8 ? Math.max(8, r.top - h - 8) : below) + 'px';
  };
  document.addEventListener('mouseover', e => {
    const a = e.target.closest('sup.footnote-ref a');
    if (a){ clearTimeout(hideT); showFor(a); return; }
    if (e.target.closest('#fnpop')){ clearTimeout(hideT); return; }
    hideFnPop(250);
  });
  window.hideFnPop = ms => {
    clearTimeout(hideT);
    if (!ms){ pop.style.display = 'none'; return; }
    hideT = setTimeout(() => pop.style.display = 'none', ms);
  };
}

/* ================= article page ================= */
async function renderNote(note, params){
  $('#app').innerHTML = '<p class="loading wrap">Loading…</p>';
  let src;
  try{
    src = await (await fetch(encodeURI(note.file), {cache:'no-store'})).text();
  }catch(e){
    $('#app').innerHTML = '<p class="err wrap">Could not load ' + esc(note.file) + '</p>';
    return;
  }
  curSrc = src; curNote = note;
  document.title = note.title;
  setPageActions(note);

  const notesByTitle = {};
  for (const n of manifest.notes){
    notesByTitle[norm(n.title)] = n;
    notesByTitle[norm(n.file.replace(/^.*\//,'').replace(/\.md$/,''))] = n;
  }

  const body = md.render(preprocess(src, notesByTitle));
  const vids = (note.videos && note.videos.length) ? note.videos
             : (note.youtube ? [{label:'Watch', id:note.youtube}] : []);
  const hasVideo = vids.length > 0;
  const hasSync = !!(hasVideo && note.timestamps && note.timestamps.length);
  document.body.classList.toggle('sync', hasVideo);   // wide right column whenever there is a video
  document.body.classList.add('article');
  document.body.classList.remove('vhide');

  const nav = '<nav class="files">' + navInner(note.slug) + '</nav>';

  $('#app').innerHTML =
    '<div class="layout">' + nav
    + '<article id="article">' + body + '</article>'
    + '<div class="sidePanel' + (hasVideo ? ' videoPanel' : '') + '">'
    +   (hasVideo ?
        '<div class="sideRsz" id="sideRsz" title="Drag to resize · double-click to reset"></div>'
      + (vids.length > 1
          ? '<div class="vtabs">' + vids.map((v,i) =>
              '<button class="btn vtab' + (i===0?' on':'') + '" data-i="' + i + '">' + esc(v.label) + '</button>').join('') + '</div>'
          : '')
      + '<div class="frame"><div id="yt"></div></div>'
      + '<div class="controls">'
      + (hasSync ? '<button class="btn on" id="followBtn" title="Scroll the transcript to follow the video">Auto-scroll: on</button>' : '')
      + '<span class="now" id="nowSec"></span>'
      + '<a class="btn" id="extLink" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + esc(vids[0].id) + '" title="Open on YouTube">↗ YouTube</a>'
      + '<button class="btn" id="vidToggle" title="Show or hide the video">Hide video</button>'
      + '</div>' : '')
    +   '<div class="toc" id="toc"><h4>Chapters</h4></div>'
    + '</div>'
    + '</div>';

  attachNavSort();
  markCrossLinks();
  decorateArticle(note, hasSync);
  buildToc(hasSync);
  curVids = vids; activeVid = 0;
  if (hasVideo){
    initPlayer(vids[0].id, hasSync);
    initSideResize();
    document.querySelectorAll('.vtab').forEach(b =>
      b.addEventListener('click', () => switchVid(+b.dataset.i)));
    const vt = $('#vidToggle');
    if (vt) vt.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('vhide');
      vt.textContent = hidden ? 'Show video' : 'Hide video';
    });
  }
  applySideLayout();
  window.addEventListener('scroll', onScrollToc, {passive:true});

  // deep links: #/slug?h=section-id and #/slug?t=seconds
  let deepDone = false;
  if (params){
    const hid = params.get('h');
    if (hid){
      const el = document.getElementById(hid);
      if (el){
        deepDone = true;
        setTimeout(() => {
          if (follow) setFollow(false, true);
          smoothScrollTo(el); flash(el);
        }, 80);
      }
    }
    const t = parseFloat(params.get('t'));
    if (!isNaN(t) && hasVideo){
      deepDone = true;
      pendingSeek = {t, v: Math.min(vids.length - 1, +params.get('v') || 0)};
    }
  }

  if (pendingJump && pendingJump.slug === note.slug){
    const p = pendingJump; pendingJump = null;
    setTimeout(() => locateAndFlash(p.plain), 60);
  } else if (!deepDone){
    offerResume(note);
  }
}

/* Give headings ids, wrap into sections, attach timestamps */
/* Group dialogue into one bordered block per speaking turn: a paragraph starting
   with "**Speaker:**" opens a turn, and every following block (extra paragraphs,
   lists, quotes, figures) joins it until the next speaker or heading. */
function markSpeakers(note){
  if (!note.speakers) return;
  const art = $('#article');
  const names = Object.keys(note.speakers);
  const speakerOf = el => {
    if (!el || el.tagName !== 'P') return null;
    const b = el.firstElementChild;
    if (!b || b.tagName !== 'STRONG') return null;
    const label = b.textContent.replace(/:\s*$/, '').trim();
    return names.includes(label) ? {name: label, strong: b} : null;
  };
  let turn = null;
  for (const node of Array.from(art.children)){
    if (/^H[1-6]$/.test(node.tagName) || node.classList.contains('footnotes')){
      turn = null;                       // headings and the footnote list end a turn
      continue;
    }
    const s = speakerOf(node);
    if (s){
      turn = document.createElement('div');
      turn.className = 'turn';
      turn.style.setProperty('--spk', note.speakers[s.name]);
      s.strong.classList.add('who');
      art.insertBefore(turn, node);
      turn.appendChild(node);
    } else if (turn){
      turn.appendChild(node);            // continuation of the current turn
    }
  }
}

function decorateArticle(note, hasSync){
  const art = $('#article');
  markSpeakers(note);
  art.querySelectorAll('h1,h2,h3').forEach(h => {
    h.id = slugify(h.textContent);
    h.dataset.title = h.textContent;          // clean text, before chips are appended
    h.dataset.plain = norm(h.textContent);
  });

  const tsByHead = {};
  (note.timestamps || []).forEach(x => { tsByHead[norm(x.h)] = {t: x.t, v: x.v || 0}; });

  const kids = Array.from(art.childNodes);
  art.innerHTML = '';
  let cur = document.createElement('section'); cur.className = 'chunk';
  const flush = () => { if (cur.childNodes.length) art.appendChild(cur); };
  sections = [];
  for (const k of kids){
    const isBreak = k.nodeType === 1 && (k.tagName === 'H2' ||
                    (k.tagName === 'H3' && tsByHead[norm(k.textContent)] !== undefined));
    if (isBreak){ flush(); cur = document.createElement('section'); cur.className = 'chunk'; }
    cur.appendChild(k);
    if (isBreak){
      const e = tsByHead[norm(k.textContent)];
      if (e !== undefined){
        sections.push({t:e.t, v:e.v, el:cur, head:k});
        if (hasSync){
          k.classList.add('stamped');
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = '▶ ' + (curVids.length > 1 && curVids[e.v] ? curVids[e.v].label + ' · ' : '') + fmt(e.t);
          k.appendChild(chip);
          k.title = 'Jump video to ' + fmt(e.t);
          k.addEventListener('click', () => seekSection(e.t, e.v));
        }
      }
    }
  }
  flush();
  sections.sort((a,b) => a.t - b.t);

  // 🔗 copy-link chips: ?t= deep link when the section has a timestamp, ?h= otherwise
  art.querySelectorAll('h2, h3').forEach(h => {
    const l = document.createElement('span');
    l.className = 'lnk'; l.textContent = '🔗';
    const e2 = tsByHead[h.dataset.plain];
    l.title = e2 !== undefined
      ? 'Copy link — opens this transcript with the video at ' + fmt(e2.t)
      : 'Copy link to this section';
    l.addEventListener('click', async e => {
      e.stopPropagation();                       // don't trigger the seek-on-click of stamped headings
      const base = location.href.split('#')[0] + '#/' + note.slug;
      const url = e2 !== undefined
        ? base + '?t=' + Math.floor(e2.t) + (e2.v ? '&v=' + e2.v : '')
        : base + '?h=' + h.id;
      try{ await navigator.clipboard.writeText(url); }catch(err){ return; }
      l.textContent = '✓'; setTimeout(() => l.textContent = '🔗', 1200);
    });
    h.appendChild(l);
  });
}

/* switch the panel player to another video of the same note */
function switchVid(i, startT){
  if (!curVids[i]) return;
  activeVid = i;
  document.querySelectorAll('.vtab').forEach((x,ix) => x.classList.toggle('on', ix === i));
  const ext = $('#extLink'); if (ext) ext.href = 'https://www.youtube.com/watch?v=' + curVids[i].id;
  if (player && player.loadVideoById){
    if (startT != null) player.loadVideoById({videoId: curVids[i].id, startSeconds: startT});
    else player.loadVideoById(curVids[i].id);
  }
}
function seekSection(t, v){
  if (!player) return;
  if (v !== activeVid) switchVid(v, t);
  else if (player.seekTo){ player.seekTo(t, true); player.playVideo(); }
}

/* ================= chapters legend (TOC) ================= */
function buildToc(hasSync){
  const toc = $('#toc');
  tocItems = [];
  const tsByHead = {};
  (curNote.timestamps || []).forEach(x => { tsByHead[norm(x.h)] = {t: x.t, v: x.v || 0}; });

  document.querySelectorAll('#article h2, #article h3').forEach(h => {
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = h.tagName === 'H3' ? 'h3' : '';
    a.textContent = (h.dataset.title || h.textContent).trim();
    const e = tsByHead[h.dataset.plain || norm(a.textContent)];
    if (hasSync && e !== undefined){
      const s = document.createElement('span'); s.className = 't'; s.textContent = fmt(e.t);
      a.appendChild(s);
    }
    a.addEventListener('click', e => {
      e.preventDefault();
      if (follow) setFollow(false, true);
      smoothScrollTo(h);
      history.replaceState(null, '', location.href.split('#')[0] + '#/' + curNote.slug);
    });
    toc.appendChild(a);
    tocItems.push({el:a, head:h});
  });
}

function onScrollToc(){
  if (!tocItems.length) return;
  let active = null;
  for (const it of tocItems){
    if (it.head.getBoundingClientRect().top <= 120) active = it; else break;
  }
  tocItems.forEach(it => it.el.classList.toggle('cur', it === active));
  if (active){
    const p = active.el.parentElement;
    const r = active.el.getBoundingClientRect(), pr = p.getBoundingClientRect();
    if (r.top < pr.top || r.bottom > pr.bottom) active.el.scrollIntoView({block:'nearest'});
  }
}

/* ================= YouTube player + sync ================= */
function plainEmbed(videoId){
  // fallback when the YouTube API can't load (e.g. strict tracking protection):
  // a bare embed — the video plays, sync features are simply unavailable
  const el = document.getElementById('yt');
  if (!el) return;
  el.outerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(videoId)
    + '" allow="encrypted-media; picture-in-picture" allowfullscreen'
    + ' style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>';
}
function initPlayer(videoId, hasSync){
  const make = () => {
    try{
      player = new YT.Player('yt', {
        videoId: videoId,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {rel:0, modestbranding:1},
        events: { onReady: startPolling, onError: () => {} }
      });
    }catch(e){ plainEmbed(videoId); }
  };
  if (ytReady) make();
  else {
    if (!document.getElementById('ytapi')){
      const s = document.createElement('script');
      s.id = 'ytapi'; s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = () => { ytReady = 'failed'; };
      document.head.appendChild(s);
    }
    let tries = 0;
    const wait = setInterval(() => {
      if (ytReady === true){ clearInterval(wait); make(); }
      else if (ytReady === 'failed' || ++tries > 30){ clearInterval(wait); plainEmbed(videoId); }
    }, 100);
  }

  const fb = $('#followBtn');
  if (fb) fb.addEventListener('click', () => setFollow(!follow));
  if (hasSync)
    ['wheel','touchmove'].forEach(ev =>
      window.addEventListener(ev, () => {
        if (suppressScrollSense > Date.now()) return;
        if (follow) setFollow(false, true);
      }, {passive:true}));
}

function setFollow(on, silent){
  follow = on;
  const b = $('#followBtn');
  if (!b) return;
  b.classList.toggle('on', on);
  b.textContent = 'Auto-scroll: ' + (on ? 'on' : 'off');
  if (on && !silent) syncNow(true);
}

function startPolling(){
  if (pendingSeek !== null && player){
    seekSection(pendingSeek.t, pendingSeek.v);
    pendingSeek = null;
  }
  pollTimer = setInterval(() => syncNow(false), 400);
}

function syncNow(force){
  if (!player || !player.getCurrentTime) return;
  let t;
  try{ t = player.getCurrentTime(); }catch(e){ return; }
  const el = $('#nowSec'); if (el) el.textContent = fmt(t);
  let active = null;
  for (const s of sections){
    if (s.v !== activeVid) continue;            // only sections of the video that is playing
    if (s.t <= t + 0.3) active = s;
  }
  document.querySelectorAll('section.chunk.active').forEach(x => { if (!active || x !== active.el) x.classList.remove('active'); });
  if (!active) return;
  if (!active.el.classList.contains('active')){
    active.el.classList.add('active');
    if (follow || force) smoothScrollTo(active.head);
  } else if (force){
    smoothScrollTo(active.head);
  }
}

function teardownPlayer(){
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if (player && player.destroy){ try{ player.destroy(); }catch(e){} }
  player = null; sections = []; tocItems = []; follow = true; pendingSeek = null; activeVid = 0;
  window.removeEventListener('scroll', onScrollToc);
}

boot();
</script>
