<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="Georgia, 'DejaVu Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="660" fill="#FBFAF7"/>
  <text x="490.0" y="36.0" font-size="20" fill="#1a1a1a" text-anchor="middle">Assumptions about consciousness and valence</text>
  <text x="490.0" y="59.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">The requirements for an elegant formalism for valence, inside the assumption they all rest on</text>
  <circle cx="490.0" cy="360.0" r="200.0" fill="#E2DED6" stroke="none" stroke-width="1"/>
  <circle cx="490.0" cy="360.0" r="168.0" fill="#B9B7B3" stroke="none" stroke-width="1"/>
  <circle cx="440.0" cy="360.0" r="100.0" fill="#B4605C" fill-opacity="0.88" stroke="none" stroke-width="1"/>
  <circle cx="540.0" cy="360.0" r="100.0" fill="#5C63AE" fill-opacity="0.72" stroke="none" stroke-width="1"/>
  <text x="36.0" y="214.0" font-size="14.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">Qualia formalism</text>
  <text x="36.0" y="234.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">For any conscious experience, there</text>
  <text x="36.0" y="251.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">exists a mathematical object</text>
  <text x="36.0" y="268.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">isomorphic to it.</text>
  <line x1="184.8" y1="209.0" x2="330.0" y2="209.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="330.0" y1="209.0" x2="398.0" y2="254.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <circle cx="398.0" cy="254.0" r="3.6" fill="#1a1a1a" stroke="none" stroke-width="1"/>
  <text x="36.0" y="400.0" font-size="14.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">Qualia structuralism</text>
  <text x="36.0" y="420.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">The mathematical object isomorphic to</text>
  <text x="36.0" y="437.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">a conscious experience has a rich set</text>
  <text x="36.0" y="454.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">of mathematical structures.</text>
  <line x1="212.7" y1="395.0" x2="330.0" y2="395.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="330.0" y1="395.0" x2="398.0" y2="404.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <circle cx="398.0" cy="404.0" r="3.6" fill="#1a1a1a" stroke="none" stroke-width="1"/>
  <text x="700.0" y="214.0" font-size="14.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">Valence realism</text>
  <text x="700.0" y="234.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">Valence (subjective pleasantness) is a</text>
  <text x="700.0" y="251.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">well-defined and ordered property of</text>
  <text x="700.0" y="268.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">conscious systems.</text>
  <line x1="692.0" y1="209.0" x2="650.0" y2="209.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="650.0" y1="209.0" x2="582.0" y2="316.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <circle cx="582.0" cy="316.0" r="3.6" fill="#1a1a1a" stroke="none" stroke-width="1"/>
  <text x="700.0" y="400.0" font-size="14.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">Valence structuralism</text>
  <text x="700.0" y="420.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">Valence has a simple encoding in the</text>
  <text x="700.0" y="437.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">mathematical representation of a</text>
  <text x="700.0" y="454.0" font-size="12.5" fill="#1a1a1a" text-anchor="start">system&#x27;s qualia.</text>
  <line x1="692.0" y1="395.0" x2="650.0" y2="395.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="650.0" y1="395.0" x2="490.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <circle cx="490.0" cy="400.0" r="3.6" fill="#1a1a1a" stroke="none" stroke-width="1"/>
  <text x="490.0" y="96.0" font-size="14.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Consciousness realism</text>
  <text x="490.0" y="116.0" font-size="12.5" fill="#1a1a1a" text-anchor="middle">Consciousness is a real, determinate feature of the universe</text>
  <line x1="490.0" y1="144.0" x2="490.0" y2="176.0" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <circle cx="490.0" cy="176.0" r="3.6" fill="#1a1a1a" stroke="none" stroke-width="1"/>
  <text x="490.0" y="602.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">Based on Figure 3 of Michael Edward Johnson, Principia Qualia (2016).</text>
</svg>
