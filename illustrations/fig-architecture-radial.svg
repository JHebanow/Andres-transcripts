<text x="74" y="675" font-size="12.5" fill="#3d3d3d">connections between sensory modules</text>
<text x="34" y="712" font-size="13" fill="#3d3d3d"><tspan font-weight="bold">Read it as:</tspan> vision (2D), the body (3D) and audition (1D) each project onto the screen, which minimises the mismatch between them. The screen hashes</text>
<text x="34" y="733" font-size="13" fill="#3d3d3d">its own state against memory; on a hit, the hippocampus <tspan font-style="italic">overcompletes</tspan> what is already being experienced.</text>
