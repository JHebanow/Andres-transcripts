<text x="517.0" y="341.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#3B6EA5" text-anchor="end" dominant-baseline="central">prediction</text>
<line x1="589.0" y1="368.0" x2="589.0" y2="326.0" stroke="#C77B3B" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="589.0,314.0 596.0,326.0 582.0,326.0" fill="#C77B3B" stroke="none" stroke-width="1"/>
<text x="595.0" y="333.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#C77B3B" text-anchor="start" dominant-baseline="central">prediction</text>
<text x="595.0" y="349.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#C77B3B" text-anchor="start" dominant-baseline="central">error</text>
<text x="360.0" y="538.0" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#2A2A2A" text-anchor="middle" dominant-baseline="central">Boundary circles are Markov blankets; predictions flow outward, prediction errors inward.</text>
<text x="360.0" y="556.0" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#B4534B" text-anchor="middle" dominant-baseline="central">Straight red arrows are skip connections: they bypass boundaries, so clean blankets blur.</text>
</svg>
