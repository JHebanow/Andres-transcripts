<rect x="470.0" y="165.0" width="22.0" height="22.0" rx="5" ry="5" fill="#B4CBE6" fill-opacity="1.0" stroke="#2A2A2A" stroke-width="1.4"/>
<text x="502.0" y="176.0" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#2A2A2A" text-anchor="start" dominant-baseline="central">abstract priors</text>
<rect x="470.0" y="197.0" width="22.0" height="22.0" rx="5" ry="5" fill="#5B84B1" fill-opacity="1.0" stroke="#2A2A2A" stroke-width="1.4"/>
