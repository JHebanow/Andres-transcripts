<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="720" height="580" rx="18" ry="18" fill="#FAF9F6" stroke="#E5E2DA" stroke-width="1.5"/>
<text x="360.0" y="32.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#2A2A2A" text-anchor="middle" dominant-baseline="central">Predictive coding: a hierarchy of Markov blankets</text>
