<polygon points="261.5,329.0 271.2,335.5 260.3,340.6" fill="#B4534B" stroke="none" stroke-width="1"/>
<text x="470.0" y="84.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#2A2A2A" text-anchor="start" dominant-baseline="central">levels (outer → inner)</text>
<rect x="470.0" y="101.0" width="22.0" height="22.0" rx="5" ry="5" fill="#EAF0F7" fill-opacity="1.0" stroke="#2A2A2A" stroke-width="1.4"/>
<text x="502.0" y="112.0" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#2A2A2A" text-anchor="start" dominant-baseline="central">sensory data</text>
<rect x="470.0" y="133.0" width="22.0" height="22.0" rx="5" ry="5" fill="#D2E0EF" fill-opacity="1.0" stroke="#2A2A2A" stroke-width="1.4"/>
