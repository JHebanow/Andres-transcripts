<text x="470.0" y="266.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#2A2A2A" text-anchor="start" dominant-baseline="central">across each boundary:</text>
<rect x="478.0" y="286.0" width="150.0" height="28.0" rx="7" ry="7" fill="#B4CBE6" fill-opacity="1.0" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="553.0" y="300.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2A2A2A" text-anchor="middle" dominant-baseline="central">inner (higher) level</text>
<rect x="478.0" y="368.0" width="150.0" height="28.0" rx="7" ry="7" fill="#EAF0F7" fill-opacity="1.0" stroke="#2A2A2A" stroke-width="1.6"/>
<text x="553.0" y="382.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2A2A2A" text-anchor="middle" dominant-baseline="central">outer (lower) level</text>
<line x1="523.0" y1="314.0" x2="523.0" y2="356.0" stroke="#3B6EA5" stroke-width="2.2" stroke-linecap="round"/>
