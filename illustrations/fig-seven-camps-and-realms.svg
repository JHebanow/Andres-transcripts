<svg xmlns="http://www.w3.org/2000/svg" width="980" height="572" viewBox="0 0 980 572" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
<title>The seven camps of the Superhappiness Festival, from Hedonism at the bottom to Paradise Engineering at the top, with each camp's key insight, failure mode, and Buddhist realm</title>
<rect x="0" y="0" width="980" height="572" rx="14" fill="#fbfaf6"/>
<rect x="60" y="478" width="904" height="64" rx="8" fill="#f6e3d3"/>
<rect x="60" y="408" width="904" height="64" rx="8" fill="#f3e8cf"/>
<rect x="60" y="338" width="904" height="64" rx="8" fill="#eef0d2"/>
<rect x="60" y="268" width="904" height="64" rx="8" fill="#dff0dc"/>
<rect x="60" y="198" width="904" height="64" rx="8" fill="#d9eeea"/>
<rect x="60" y="128" width="904" height="64" rx="8" fill="#dce8f4"/>
<rect x="60" y="58" width="904" height="64" rx="8" fill="#e6e0f4"/>
<line x1="285" y1="58" x2="285" y2="542" stroke="#ffffff" stroke-width="2"/>
<line x1="565" y1="58" x2="565" y2="542" stroke="#ffffff" stroke-width="2"/>
<line x1="805" y1="58" x2="805" y2="542" stroke="#ffffff" stroke-width="2"/>
<line x1="34" y1="538" x2="34" y2="76.0" stroke="#5c5c5c" stroke-width="3"/>
<polygon points="34.0,62.0 41.0,76.0 27.0,76.0" fill="#5c5c5c"/>
<text x="80.0" y="46.0" font-size="13" font-weight="bold" fill="#5c5c5c">Camp</text>
<text x="300.0" y="46.0" font-size="13" font-weight="bold" fill="#5c5c5c">Key insight</text>
<text x="580.0" y="46.0" font-size="13" font-weight="bold" fill="#5c5c5c">Failure mode</text>
<text x="820.0" y="46.0" font-size="13" font-weight="bold" fill="#5c5c5c">Buddhist realm</text>
<text x="80.0" y="514.0" font-size="14" font-weight="bold" fill="#2b2b2b">1. Hedonism</text>
<text x="300.0" y="514.0" font-size="13" fill="#2b2b2b">Value exists — go out and get it</text>
<text x="580.0" y="505.0" font-size="13" fill="#2b2b2b">Hedonic adaptation; always</text>
<text x="580.0" y="523.0" font-size="13" fill="#2b2b2b">craving more</text>
<text x="820.0" y="514.0" font-size="13" fill="#2b2b2b">hungry ghost</text>
<text x="80.0" y="444.0" font-size="14" font-weight="bold" fill="#2b2b2b">2. Psychiatry</text>
<text x="300.0" y="435.0" font-size="13" fill="#2b2b2b">Second-order desires; area under</text>
<text x="300.0" y="453.0" font-size="13" fill="#2b2b2b">the curve; economies of scale</text>
<text x="580.0" y="435.0" font-size="13" fill="#2b2b2b">Normalizes; distrusts intense</text>
<text x="580.0" y="453.0" font-size="13" fill="#2b2b2b">happiness</text>
<text x="820.0" y="444.0" font-size="13" fill="#2b2b2b">animal</text>
<text x="80.0" y="374.0" font-size="14" font-weight="bold" fill="#2b2b2b">3. Wholesome</text>
<text x="300.0" y="365.0" font-size="13" fill="#2b2b2b">Cultivate love systematically; listen</text>
<text x="300.0" y="383.0" font-size="13" fill="#2b2b2b">to your body</text>
<text x="580.0" y="365.0" font-size="13" fill="#2b2b2b">Innumerate; smuggles in</text>
<text x="580.0" y="383.0" font-size="13" fill="#2b2b2b">shadow; complacent</text>
<text x="820.0" y="374.0" font-size="13" fill="#2b2b2b">god</text>
<text x="80.0" y="304.0" font-size="14" font-weight="bold" fill="#2b2b2b">4. Paleo</text>
<text x="300.0" y="295.0" font-size="13" fill="#2b2b2b">Wary of superstimuli and novel</text>
<text x="300.0" y="313.0" font-size="13" fill="#2b2b2b">interventions; respects incentives</text>
<text x="580.0" y="295.0" font-size="13" fill="#2b2b2b">Too romantic about human</text>
<text x="580.0" y="313.0" font-size="13" fill="#2b2b2b">nature</text>
<text x="820.0" y="304.0" font-size="13" fill="#2b2b2b">titan</text>
<text x="80.0" y="234.0" font-size="14" font-weight="bold" fill="#2b2b2b">5. Energy</text>
<text x="300.0" y="225.0" font-size="13" fill="#2b2b2b">Energy power-washes gunk from</text>
<text x="300.0" y="243.0" font-size="13" fill="#2b2b2b">the nervous system</text>
<text x="580.0" y="216.0" font-size="13" fill="#2b2b2b">Alchemy without causal</text>
<text x="580.0" y="234.0" font-size="13" fill="#2b2b2b">understanding; amplifies</text>
<text x="580.0" y="252.0" font-size="13" fill="#2b2b2b">suffering</text>
<text x="820.0" y="234.0" font-size="13" fill="#2b2b2b">hell</text>
<text x="80.0" y="164.0" font-size="14" font-weight="bold" fill="#2b2b2b">6. Self-Organization</text>
<text x="300.0" y="155.0" font-size="13" fill="#2b2b2b">Low-level principles that scale up</text>
<text x="300.0" y="173.0" font-size="13" fill="#2b2b2b">into the good</text>
<text x="580.0" y="164.0" font-size="13" fill="#2b2b2b">Closes you off to the mystery</text>
<text x="820.0" y="164.0" font-size="13" fill="#2b2b2b">human</text>
<text x="80.0" y="85.0" font-size="14" font-weight="bold" fill="#2b2b2b">7. Paradise</text>
<text x="80.0" y="103.0" font-size="14" font-weight="bold" fill="#2b2b2b">Engineering</text>
<text x="300.0" y="76.0" font-size="13" fill="#2b2b2b">The aesthetic of the</text>
<text x="300.0" y="94.0" font-size="13" fill="#2b2b2b">meta-aesthetic: alloys without</text>
<text x="300.0" y="112.0" font-size="13" fill="#2b2b2b">attachment</text>
<text x="580.0" y="94.0" font-size="13" fill="#5c5c5c">—</text>
<text x="820.0" y="76.0" font-size="13" fill="#2b2b2b">pure lands,</text>
<text x="820.0" y="94.0" font-size="13" fill="#2b2b2b">outside the six</text>
<text x="820.0" y="112.0" font-size="13" fill="#2b2b2b">realms</text>
</svg>