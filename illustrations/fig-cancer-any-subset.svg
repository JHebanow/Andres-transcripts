<text x="30" y="372" font-size="11.5" fill="#B4472F" font-style="italic">dashed outlines: some of the subsets that could defect</text>
<line x1="24" y1="412" x2="736" y2="412" stroke="#e0ddd6" stroke-width="1"/>
<text x="30" y="440" font-size="13.5" fill="#3d3d3d">A tumour is a subset of the organism that perceives itself as a separate entity, scavenges resources, and multiplies. It is not</text>
<text x="30" y="462" font-size="13.5" fill="#3d3d3d">like a computer virus, where a few key bottlenecks can be guarded. <tspan font-weight="bold" fill="#B4472F">Any</tspan> subset can defect against its complement &#8212; so</text>
<text x="30" y="484" font-size="13.5" fill="#3d3d3d">what must be induced to cooperate is <tspan font-style="italic">every possible partition</tspan>, of which there is a combinatorial explosion. None of them</text>
<text x="30" y="506" font-size="13.5" fill="#3d3d3d">respects the tidy nesting above. That is the magnitude of the problem consciousness is solving.</text>
</svg>