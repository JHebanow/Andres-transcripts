<line x1="58" y1="136" x2="301.6" y2="228.2" stroke="#b8b2a4" stroke-width="0.9"/><circle cx="301.6" cy="228.2" r="2" fill="#b8b2a4"/><text x="52" y="140" text-anchor="start" font-size="11.5" fill="#6b6b6b">organs / modules</text>
<line x1="702" y1="136" x2="436.5" y2="179.5" stroke="#b8b2a4" stroke-width="0.9"/><circle cx="436.5" cy="179.5" r="2" fill="#b8b2a4"/><text x="708" y="140" text-anchor="end" font-size="11.5" fill="#6b6b6b">sub-modules</text>
<line x1="702" y1="348" x2="450.3" y2="299.9" stroke="#b8b2a4" stroke-width="0.9"/><circle cx="450.3" cy="299.9" r="2" fill="#b8b2a4"/><text x="708" y="352" text-anchor="end" font-size="11.5" fill="#6b6b6b">and smaller parts within those</text>
<line x1="24" y1="412" x2="736" y2="412" stroke="#e0ddd6" stroke-width="1"/>
<text x="30" y="440" font-size="13.5" fill="#3d3d3d"><tspan font-weight="bold">Every part sits inside exactly one whole.</tspan> Each boundary nests neatly inside the boundary above it; nothing overlaps,</text>
<text x="30" y="462" font-size="13.5" fill="#3d3d3d">nothing straddles two bags at once, and the whole is just the sum of its parts. It is better than nothing as a way of thinking</text>
<text x="30" y="484" font-size="13.5" fill="#3d3d3d">about what you are &#8212; but it gets significant details wrong, and it is deceptively simple.</text>
