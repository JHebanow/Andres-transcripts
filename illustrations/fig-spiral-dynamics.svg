<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 696" width="960" height="696" font-family="Georgia, 'DejaVu Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="960" height="696" fill="#FBFAF7"/>
  <text x="480.0" y="38.0" font-size="20" fill="#1a1a1a" text-anchor="middle">Spiral Dynamics</text>
  <text x="255.0" y="84.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">express self (“I”)</text>
  <text x="555.0" y="84.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">sacrifice self to the group (“we”)</text>
  <rect x="150.0" y="550.0" width="330.0" height="50.0" rx="6" fill="#EADFC8" stroke="#9C8558" stroke-width="1.4"/>
  <text x="164.0" y="571.0" font-size="13.5" fill="#9C8558" text-anchor="start" font-weight="bold">Beige</text>
  <text x="164.0" y="589.0" font-size="12" fill="#1a1a1a" text-anchor="start">survival: instinctive, automatic</text>
  <rect x="330.0" y="490.0" width="330.0" height="50.0" rx="6" fill="#D8C8E6" stroke="#7A5C99" stroke-width="1.4"/>
  <text x="344.0" y="511.0" font-size="13.5" fill="#7A5C99" text-anchor="start" font-weight="bold">Purple</text>
  <text x="344.0" y="529.0" font-size="12" fill="#1a1a1a" text-anchor="start">tribal: kinship, magic, ritual</text>
  <rect x="150.0" y="430.0" width="330.0" height="50.0" rx="6" fill="#EDB6AE" stroke="#A6453A" stroke-width="1.4"/>
  <text x="164.0" y="451.0" font-size="13.5" fill="#A6453A" text-anchor="start" font-weight="bold">Red</text>
  <text x="164.0" y="469.0" font-size="12" fill="#1a1a1a" text-anchor="start">power: impulsive, egocentric</text>
  <rect x="330.0" y="370.0" width="330.0" height="50.0" rx="6" fill="#B9CDE8" stroke="#3E679E" stroke-width="1.4"/>
  <text x="344.0" y="391.0" font-size="13.5" fill="#3E679E" text-anchor="start" font-weight="bold">Blue</text>
  <text x="344.0" y="409.0" font-size="12" fill="#1a1a1a" text-anchor="start">order: one right way, absolute truth</text>
  <rect x="150.0" y="310.0" width="330.0" height="50.0" rx="6" fill="#F4CDA7" stroke="#B36A24" stroke-width="1.4"/>
  <text x="164.0" y="331.0" font-size="13.5" fill="#B36A24" text-anchor="start" font-weight="bold">Orange</text>
  <text x="164.0" y="349.0" font-size="12" fill="#1a1a1a" text-anchor="start">achievement: science, strategy, progress</text>
  <rect x="330.0" y="250.0" width="330.0" height="50.0" rx="6" fill="#C3DEBB" stroke="#4E8A43" stroke-width="1.4"/>
  <text x="344.0" y="271.0" font-size="13.5" fill="#4E8A43" text-anchor="start" font-weight="bold">Green</text>
  <text x="344.0" y="289.0" font-size="12" fill="#1a1a1a" text-anchor="start">community: pluralism, many ways of knowing</text>
  <rect x="150.0" y="164.0" width="330.0" height="50.0" rx="6" fill="#F3E6A8" stroke="#9C8420" stroke-width="1.4"/>
  <text x="164.0" y="185.0" font-size="13.5" fill="#9C8420" text-anchor="start" font-weight="bold">Yellow</text>
  <text x="164.0" y="203.0" font-size="12" fill="#1a1a1a" text-anchor="start">integrative: systemic, flexible</text>
  <rect x="330.0" y="104.0" width="330.0" height="50.0" rx="6" fill="#B3E0DA" stroke="#2E8A80" stroke-width="1.4"/>
  <text x="344.0" y="125.0" font-size="13.5" fill="#2E8A80" text-anchor="start" font-weight="bold">Turquoise</text>
  <text x="344.0" y="143.0" font-size="12" fill="#1a1a1a" text-anchor="start">holistic: whole-systems, global</text>
  <line x1="40.0" y1="232.0" x2="690.0" y2="232.0" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="40.0" y="224.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="bold">second tier</text>
  <text x="40.0" y="250.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="bold">first tier</text>
  <line x1="664.0" y1="395.0" x2="730.0" y2="395.0" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="740.0" y="393.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold">traditional</text>
  <text x="740.0" y="410.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">religion, nationalism</text>
  <line x1="484.0" y1="335.0" x2="730.0" y2="335.0" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="740.0" y="333.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold">modern</text>
  <text x="740.0" y="350.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">scientific materialism</text>
  <line x1="664.0" y1="275.0" x2="730.0" y2="275.0" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="740.0" y="273.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold">postmodern</text>
  <text x="740.0" y="290.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">many ways of knowing</text>
  <path d="M 718 108 L 726 108 L 726 210 L 718 210" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="740.0" y="157.0" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold">integral</text>
  <text x="740.0" y="174.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">the second tier as a whole</text>
  <text x="480.0" y="640.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">Spiral Dynamics is Don Beck and Christopher Cowan&#x27;s development of Clare Graves&#x27;s research; Ken Wilber folded it into integral theory. Levels</text>
  <text x="480.0" y="655.2" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">alternate between self-expressive and group-oriented; the move to the second tier is where every earlier level can, in Wilber&#x27;s reading, be seen as</text>
  <text x="480.0" y="670.4" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">partly valid.</text>
</svg>
