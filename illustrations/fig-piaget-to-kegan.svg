<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" font-family="Georgia, 'DejaVu Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="960" height="452" fill="#FBFAF7"/>
  <text x="480.0" y="38.0" font-size="20" fill="#1a1a1a" text-anchor="middle">From Piaget to Kegan</text>
  <text x="480.0" y="62.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">Kegan&#x27;s orders of consciousness, set against Piaget&#x27;s stages as Kegan pairs them in The Evolving Self (1982)</text>
  <text x="24.0" y="155.0" font-size="15" fill="#56789C" text-anchor="start" font-weight="bold">Piaget</text>
  <text x="24.0" y="173.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">cognitive stages</text>
  <text x="24.0" y="319.0" font-size="15" fill="#A06A3E" text-anchor="start" font-weight="bold">Kegan</text>
  <text x="24.0" y="337.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">orders of</text>
  <text x="24.0" y="352.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">consciousness</text>
  <rect x="136.0" y="104.0" width="128.0" height="92.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.4"/>
  <text x="200.0" y="146.6" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Sensorimotor</text>
  <text x="200.0" y="164.1" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">birth – ~2</text>
  <rect x="270.0" y="104.0" width="128.0" height="92.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.4"/>
  <text x="334.0" y="146.6" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Preoperational</text>
  <text x="334.0" y="164.1" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">~2 – 7</text>
  <rect x="404.0" y="104.0" width="128.0" height="92.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.4"/>
  <text x="468.0" y="137.8" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Concrete</text>
  <text x="468.0" y="155.3" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">operational</text>
  <text x="468.0" y="172.9" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">~7 – 11</text>
  <rect x="538.0" y="104.0" width="262.0" height="92.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.4"/>
  <text x="669.0" y="146.6" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Formal operational</text>
  <text x="669.0" y="164.1" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">~11 onward</text>
  <line x1="669.0" y1="172.0" x2="669.0" y2="192.0" stroke="#56789C" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="602.0" y="186.0" font-size="10.5" fill="#56789C" text-anchor="middle" font-style="italic">early</text>
  <text x="736.0" y="186.0" font-size="10.5" fill="#56789C" text-anchor="middle" font-style="italic">full</text>
  <rect x="806.0" y="104.0" width="128.0" height="92.0" rx="6" fill="none" stroke="#B9B9B9" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="870.0" y="153.5" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">no Piagetian stage</text>
  <rect x="136.0" y="250.0" width="128.0" height="128.0" rx="6" fill="#F9F1E8" stroke="#A06A3E" stroke-width="1.4"/>
  <text x="200.0" y="310.6" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">0 · Incorporative</text>
  <text x="200.0" y="325.6" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">infancy</text>
  <rect x="270.0" y="250.0" width="128.0" height="128.0" rx="6" fill="#F4E7D8" stroke="#A06A3E" stroke-width="1.4"/>
  <text x="334.0" y="303.2" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1 · Impulsive</text>
  <text x="334.0" y="318.1" font-size="11.5" fill="#A06A3E" text-anchor="middle">impulsive mind</text>
  <text x="334.0" y="333.1" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">early childhood</text>
  <rect x="404.0" y="250.0" width="128.0" height="128.0" rx="6" fill="#F4E7D8" stroke="#A06A3E" stroke-width="1.4"/>
  <text x="468.0" y="303.2" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2 · Imperial</text>
  <text x="468.0" y="318.1" font-size="11.5" fill="#A06A3E" text-anchor="middle">instrumental mind</text>
  <text x="468.0" y="333.1" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">later childhood</text>
  <rect x="538.0" y="250.0" width="128.0" height="128.0" rx="6" fill="#F4E7D8" stroke="#A06A3E" stroke-width="1.4"/>
  <text x="602.0" y="296.3" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3 · Interpersonal</text>
  <text x="602.0" y="311.3" font-size="11.5" fill="#A06A3E" text-anchor="middle">socialized mind</text>
  <text x="602.0" y="326.2" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">adolescence on;</text>
  <text x="602.0" y="339.9" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">many adults</text>
  <rect x="672.0" y="250.0" width="128.0" height="128.0" rx="6" fill="#F4E7D8" stroke="#A06A3E" stroke-width="1.4"/>
  <text x="736.0" y="295.7" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4 · Institutional</text>
  <text x="736.0" y="310.6" font-size="11.5" fill="#A06A3E" text-anchor="middle">self-authoring</text>
  <text x="736.0" y="325.6" font-size="11.5" fill="#A06A3E" text-anchor="middle">mind</text>
  <text x="736.0" y="340.5" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">a minority of adults</text>
  <rect x="806.0" y="250.0" width="128.0" height="128.0" rx="6" fill="#F4E7D8" stroke="#A06A3E" stroke-width="1.4"/>
  <text x="870.0" y="288.9" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">5 · Interindividual</text>
  <text x="870.0" y="303.8" font-size="11.5" fill="#A06A3E" text-anchor="middle">self-transforming</text>
  <text x="870.0" y="318.8" font-size="11.5" fill="#A06A3E" text-anchor="middle">mind</text>
  <text x="870.0" y="333.7" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">rare; seldom before</text>
  <text x="870.0" y="347.3" font-size="10.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">midlife</text>
  <line x1="200.0" y1="198.0" x2="200.0" y2="248.0" stroke="#9A9A9A" stroke-width="1.2"/>
  <line x1="334.0" y1="198.0" x2="334.0" y2="248.0" stroke="#9A9A9A" stroke-width="1.2"/>
  <line x1="468.0" y1="198.0" x2="468.0" y2="248.0" stroke="#9A9A9A" stroke-width="1.2"/>
  <line x1="602.0" y1="198.0" x2="602.0" y2="248.0" stroke="#9A9A9A" stroke-width="1.2"/>
  <line x1="736.0" y1="198.0" x2="736.0" y2="248.0" stroke="#9A9A9A" stroke-width="1.2"/>
  <line x1="870.0" y1="198.0" x2="870.0" y2="248.0" stroke="#C9C9C9" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 136 396 L 136 404 L 666 404 L 666 396" fill="none" stroke="#6b6b6b" stroke-width="1.2"/>
  <path d="M 672 396 L 672 404 L 934 404 L 934 396" fill="none" stroke="#A06A3E" stroke-width="1.2"/>
  <text x="401.0" y="424.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle">childhood and adolescence: where Piaget&#x27;s account ends</text>
  <text x="803.0" y="424.0" font-size="12.5" fill="#A06A3E" text-anchor="middle">adult transformations</text>
</svg>
