<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Georgia, 'Times New Roman', serif">
  <rect width="960" height="700" fill="#ffffff"/>

  <defs>
    <marker id="axis" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1a202c"/>
    </marker>
    <marker id="blue" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 z" fill="#2b6cb0"/>
    </marker>
    <marker id="orange" markerWidth="6" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- anti-fragile band -->
  <rect x="130" y="120" width="720" height="130" fill="#faf089" fill-opacity="0.30"/>
  <line x1="130" y1="250" x2="850" y2="250" stroke="#2f855a" stroke-width="2.5"/>
  <text x="560" y="152" fill="#276749" font-size="15">most realms live up here</text>
  <text x="560" y="172" fill="#276749" font-size="15">(already pretty fabricated)</text>

  <!-- 5-MeO stepped descent -->
  <circle cx="148" cy="140" r="7" fill="#9b2c2c"/>
  <circle cx="148" cy="175" r="5.5" fill="#9b2c2c"/>
  <circle cx="148" cy="205" r="4" fill="#9b2c2c"/>
  <circle cx="148" cy="230" r="3" fill="#9b2c2c"/>
  <circle cx="148" cy="249" r="2.5" fill="#9b2c2c"/>

  <!-- defabrication arrows (down, left of origin) -->
  <line x1="165" y1="175" x2="165" y2="405" stroke="#c05621" stroke-width="5" marker-end="url(#orange)"/>
  <line x1="425" y1="330" x2="425" y2="405" stroke="#c05621" stroke-width="5" marker-end="url(#orange)"/>

  <!-- fabrication arrows (up, right of origin) -->
  <line x1="555" y1="405" x2="555" y2="330" stroke="#2b6cb0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="815" y1="405" x2="815" y2="145" stroke="#2b6cb0" stroke-width="5" marker-end="url(#blue)"/>

  <!-- axes -->
  <line x1="490" y1="430" x2="880" y2="430" stroke="#1a202c" stroke-width="2" marker-end="url(#axis)"/>
  <line x1="490" y1="430" x2="110" y2="430" stroke="#1a202c" stroke-width="2" marker-end="url(#axis)"/>
  <line x1="490" y1="430" x2="490" y2="70" stroke="#1a202c" stroke-width="2" marker-end="url(#axis)"/>
  <circle cx="490" cy="430" r="6" fill="#e53e3e"/>

  <text x="505" y="66" fill="#1a202c" font-size="16">pre-existing level of fabrication</text>
  <text x="112" y="458" fill="#1a202c" font-size="15">&#8592; (rate of) DEFABRICATION</text>
  <text x="660" y="458" fill="#1a202c" font-size="15">(rate of) FABRICATION &#8594;</text>

  <!-- legend, single column -->
  <line x1="60" y1="500" x2="900" y2="500" stroke="#cbd5e0" stroke-width="1"/>

  <circle cx="72" cy="533" r="6" fill="#e53e3e"/>
  <text x="94" y="538" font-size="14" fill="#2d3748">Origin &#8212; nothing being fabricated at all: <tspan font-style="italic">nirodha sam&#0257;patti</tspan>.</text>

  <line x1="64" y1="568" x2="80" y2="568" stroke="#2f855a" stroke-width="3"/>
  <text x="94" y="573" font-size="14" fill="#2d3748">Above this line, the realm is anti-fragile &#8212; and that is where most people live.</text>

  <line x1="72" y1="595" x2="72" y2="611" stroke="#2b6cb0" stroke-width="4" marker-end="url(#blue)"/>
  <text x="94" y="608" font-size="14" fill="#2d3748">Right of the origin you are fabricating, so the level <tspan font-weight="bold">rises</tspan> &#8212; fast far out, slowly near the origin.</text>

  <line x1="72" y1="630" x2="72" y2="646" stroke="#c05621" stroke-width="4" marker-end="url(#orange)"/>
  <text x="94" y="643" font-size="14" fill="#2d3748">Left of the origin you are defabricating, so the level <tspan font-weight="bold">falls</tspan> &#8212; fast far out, slowly near the origin.</text>

  <circle cx="72" cy="673" r="6" fill="#9b2c2c"/>
  <text x="94" y="678" font-size="14" fill="#2d3748">Therapeutic-dose 5-MeO-DMT: starts you high, steps you down a session at a time &#8212; often not clearing the threshold in one go.</text>
</svg>
