<text x="380.0" y="36" text-anchor="middle" font-size="20" fill="#1a1a1a">Overlapping groups: the chess club</text>
<text x="380.0" y="59" text-anchor="middle" font-size="13.5" fill="#6b6b6b" font-style="italic">Which alliances exist depends on the scale you look at &#8212; and they cut across one another.</text>
