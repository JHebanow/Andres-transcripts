<text x="438" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#7E4A8C">the chess club (30)</text>
<text x="312" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2F6B8F">three close friends</text>
<line x1="24" y1="392" x2="736" y2="392" stroke="#e0ddd6" stroke-width="1"/>
<text x="30" y="414" font-size="13.5" fill="#3d3d3d" textLength="700" lengthAdjust="spacing">Three friends get on at the level of three; the chess club gets on at the level of thirty; <tspan font-weight="bold">only one of</tspan></text>
<text x="30" y="434" font-size="13.5" fill="#3d3d3d" textLength="700" lengthAdjust="spacing"><tspan font-weight="bold">the three is in the club.</tspan> The groupings do not nest &#8212; they cut across each other. And this is what</text>
<text x="30" y="454" font-size="13.5" fill="#3d3d3d" textLength="700" lengthAdjust="spacing">holds the whole together: two feuding cliques cannot destroy each other if two-thirds of both belong</text>
<text x="30" y="474" font-size="13.5" fill="#3d3d3d">to the club. <tspan font-weight="bold">Hence a hypergraph, not a set of sets</tspan> &#8212; edges binding many nodes at once.</text>
</svg>