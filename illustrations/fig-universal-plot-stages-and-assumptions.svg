<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 728" width="980" height="728" font-family="Georgia, 'DejaVu Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="728" fill="#FBFAF7"/>
  <text x="490.0" y="36.0" font-size="20" fill="#1a1a1a" text-anchor="middle">The universal plot: four stages, seven assumptions</text>
  <text x="490.0" y="59.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">How each worldview frames what is going on, and what the fourth one rests on</text>
  <rect x="30.0" y="88.0" width="920.0" height="100.0" rx="6" fill="#E9E1F2" stroke="#5B3F86" stroke-width="1.4"/>
  <text x="42.0" y="126.3" font-size="15" fill="#5B3F86" text-anchor="start" font-weight="bold">4 · Consciousness vs. pure replicators</text>
  <text x="42.0" y="146.1" font-size="12.5" fill="#1a1a1a" text-anchor="start">The plot: consciousness, which is where value lives, against patterns that do nothing but copy themselves.</text>
  <text x="42.0" y="162.6" font-size="12.5" fill="#5B3F86" text-anchor="start" font-style="italic">What it adds: a principled way of resolving disagreements.</text>
  <rect x="30.0" y="244.0" width="400.0" height="112.0" rx="6" fill="#F2EEE6" stroke="#7A6A55" stroke-width="1.4"/>
  <text x="42.0" y="272.6" font-size="13.5" fill="#7A6A55" text-anchor="start" font-weight="bold">3 · Gradients of wisdom</text>
  <text x="42.0" y="290.5" font-size="12" fill="#1a1a1a" text-anchor="start">The plot: some memeplexes really are better for flourishing</text>
  <text x="42.0" y="306.3" font-size="12" fill="#1a1a1a" text-anchor="start">than others.</text>
  <text x="42.0" y="322.1" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">Where it stops: no principled way of settling disagreements;</text>
  <text x="42.0" y="338.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">flourishing is not a natural kind.</text>
  <rect x="30.0" y="392.0" width="400.0" height="112.0" rx="6" fill="#F2EEE6" stroke="#7A6A55" stroke-width="1.4"/>
  <text x="42.0" y="420.6" font-size="13.5" fill="#7A6A55" text-anchor="start" font-weight="bold">2 · The balance between good and evil</text>
  <text x="42.0" y="438.5" font-size="12" fill="#1a1a1a" text-anchor="start">The plot: light and dark balance out, and the balance itself is</text>
  <text x="42.0" y="454.3" font-size="12" fill="#1a1a1a" text-anchor="start">perfect.</text>
  <text x="42.0" y="470.1" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">Where it stops: a coping mechanism that makes suffering</text>
  <text x="42.0" y="486.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">feel acceptable and blocks looking at it.</text>
  <rect x="30.0" y="540.0" width="400.0" height="112.0" rx="6" fill="#F2EEE6" stroke="#7A6A55" stroke-width="1.4"/>
  <text x="42.0" y="576.6" font-size="13.5" fill="#7A6A55" text-anchor="start" font-weight="bold">1 · The battle between good and evil</text>
  <text x="42.0" y="594.4" font-size="12" fill="#1a1a1a" text-anchor="start">The plot: fundamental good fights true evil.</text>
  <text x="42.0" y="610.2" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">Where it stops: treats evil as an essence, missing the causes</text>
  <text x="42.0" y="626.1" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">and conditions behind it.</text>
  <line x1="230.0" y1="540.0" x2="230.0" y2="513.0" stroke="#7A6A55" stroke-width="1.4"/>
  <polygon points="230.0,504.0 234.5,513.0 225.5,513.0" fill="#7A6A55" stroke="none" stroke-width="1"/>
  <line x1="230.0" y1="392.0" x2="230.0" y2="365.0" stroke="#7A6A55" stroke-width="1.4"/>
  <polygon points="230.0,356.0 234.5,365.0 225.5,365.0" fill="#7A6A55" stroke="none" stroke-width="1"/>
  <line x1="230.0" y1="244.0" x2="230.0" y2="197.0" stroke="#7A6A55" stroke-width="1.4"/>
  <polygon points="230.0,188.0 234.5,197.0 225.5,197.0" fill="#7A6A55" stroke="none" stroke-width="1"/>
  <rect x="470.0" y="244.0" width="150.0" height="84.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.2"/>
  <text x="479.0" y="267.2" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Open</text>
  <text x="479.0" y="283.7" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">individualism</text>
  <text x="479.0" y="300.2" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">we are all the same</text>
  <text x="479.0" y="314.8" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">consciousness</text>
  <rect x="635.0" y="244.0" width="150.0" height="84.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.2"/>
  <text x="644.0" y="260.0" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Universal</text>
  <text x="644.0" y="276.5" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Darwinism</text>
  <text x="644.0" y="293.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">whatever copies itself</text>
  <text x="644.0" y="307.5" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">best comes to fill</text>
  <text x="644.0" y="322.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">everything</text>
  <rect x="800.0" y="244.0" width="150.0" height="84.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.2"/>
  <text x="809.0" y="260.0" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Valence</text>
  <text x="809.0" y="276.5" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">structuralism</text>
  <text x="809.0" y="293.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">valence is encoded in</text>
  <text x="809.0" y="307.5" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">the structure of</text>
  <text x="809.0" y="322.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">experience</text>
  <rect x="800.0" y="352.0" width="150.0" height="84.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.2"/>
  <text x="809.0" y="376.2" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Qualia formalism</text>
  <text x="809.0" y="392.7" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">each experience has a</text>
  <text x="809.0" y="407.2" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">mathematical</text>
  <text x="809.0" y="421.8" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">description</text>
  <rect x="800.0" y="460.0" width="150.0" height="84.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.2"/>
  <text x="809.0" y="483.2" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Consciousness</text>
  <text x="809.0" y="499.7" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">realism</text>
  <text x="809.0" y="516.2" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">consciousness is real,</text>
  <text x="809.0" y="530.8" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">not an illusion</text>
  <rect x="470.0" y="406.0" width="150.0" height="84.0" rx="6" fill="#E3EBF3" stroke="#56789C" stroke-width="1.2"/>
  <text x="479.0" y="430.2" font-size="12.5" fill="#56789C" text-anchor="start" font-weight="bold">Pleasure principle</text>
  <text x="479.0" y="446.7" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">people are driven by</text>
  <text x="479.0" y="461.2" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">valence without</text>
  <text x="479.0" y="475.8" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">realizing it</text>
  <rect x="470.0" y="574.0" width="480.0" height="70.0" rx="6" fill="#ECEBE8" stroke="#8A8A8A" stroke-width="1.2"/>
  <text x="479.0" y="598.5" font-size="12.5" fill="#8A8A8A" text-anchor="start" font-weight="bold">Physicalism</text>
  <text x="479.0" y="615.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">underlying all of it: the laws of physics are causally closed, and on this view they</text>
  <text x="479.0" y="629.5" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">describe how qualia behave</text>
  <line x1="545.0" y1="244.0" x2="545.0" y2="197.0" stroke="#56789C" stroke-width="1.4"/>
  <polygon points="545.0,188.0 549.5,197.0 540.5,197.0" fill="#56789C" stroke="none" stroke-width="1"/>
  <line x1="710.0" y1="244.0" x2="710.0" y2="197.0" stroke="#56789C" stroke-width="1.4"/>
  <polygon points="710.0,188.0 714.5,197.0 705.5,197.0" fill="#56789C" stroke="none" stroke-width="1"/>
  <line x1="875.0" y1="244.0" x2="875.0" y2="197.0" stroke="#56789C" stroke-width="1.4"/>
  <polygon points="875.0,188.0 879.5,197.0 870.5,197.0" fill="#56789C" stroke="none" stroke-width="1"/>
  <line x1="875.0" y1="460.0" x2="875.0" y2="445.0" stroke="#56789C" stroke-width="1.4"/>
  <polygon points="875.0,436.0 879.5,445.0 870.5,445.0" fill="#56789C" stroke="none" stroke-width="1"/>
  <line x1="875.0" y1="352.0" x2="875.0" y2="337.0" stroke="#56789C" stroke-width="1.4"/>
  <polygon points="875.0,328.0 879.5,337.0 870.5,337.0" fill="#56789C" stroke="none" stroke-width="1"/>
  <line x1="470.0" y1="448.0" x2="439.0" y2="448.0" stroke="#56789C" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="430.0,448.0 439.0,443.5 439.0,452.5" fill="#56789C" stroke="none" stroke-width="1"/>
  <text x="490.0" y="686.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">The seven assumptions are those listed as needed to reach the fourth stage. The pleasure principle is used to explain the appeal of stage two; in the</text>
  <text x="490.0" y="701.2" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">written version (“The Universal Plot: Part I,” 2017), a closer look at open individualism and universal Darwinism carries stage three to stage four.</text>
</svg>
