<circle cx="240" cy="160" r="3.2" fill="#d08a2a" stroke="#ffffff" stroke-width="0.8"/>
<line x1="32" y1="160" x2="238" y2="107.25" stroke="#2f8f83" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9"/>
<circle cx="240" cy="107.25" r="3.2" fill="#2f8f83" stroke="#ffffff" stroke-width="0.8"/>
<line x1="100" y1="160" x2="238" y2="90" stroke="#c0496b" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9"/>
<circle cx="240" cy="90" r="3.2" fill="#c0496b" stroke="#ffffff" stroke-width="0.8"/>
<text x="205" y="50" font-size="12" text-anchor="middle" fill="#1e2226" font-weight="bold">camera 1</text>
