<circle cx="380" cy="142.75" r="3.2" fill="#2f8f83" stroke="#ffffff" stroke-width="0.8"/>
<line x1="240" y1="90" x2="378" y2="160" stroke="#c0496b" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9"/>
<circle cx="380" cy="160" r="3.2" fill="#c0496b" stroke="#ffffff" stroke-width="0.8"/>
<text x="345" y="50" font-size="12" text-anchor="middle" fill="#1e2226" font-weight="bold">camera 2</text>
<line x1="450" y1="62" x2="520" y2="62" stroke="#1e2226" stroke-width="1.4" stroke-linecap="round"/>
