<text x="485" y="50" font-size="12" text-anchor="middle" fill="#1e2226" font-weight="bold">camera 3</text>
<circle cx="32" cy="90" r="4" fill="#7c5cbf" stroke="#ffffff" stroke-width="1"/>
<circle cx="100" cy="90" r="4" fill="#d08a2a" stroke="#ffffff" stroke-width="1"/>
<circle cx="32" cy="160" r="4" fill="#2f8f83" stroke="#ffffff" stroke-width="1"/>
<circle cx="100" cy="160" r="4" fill="#c0496b" stroke="#ffffff" stroke-width="1"/>
<text x="170" y="207" font-size="12" text-anchor="middle" fill="#6b7280">aperture</text>
<text x="240" y="207" font-size="12" text-anchor="middle" fill="#6b7280">screen</text>
<circle cx="548" cy="125" r="2.4" fill="#1e2226" stroke="none" stroke-width="0"/>
<circle cx="560" cy="125" r="2.4" fill="#1e2226" stroke="none" stroke-width="0"/>
<circle cx="572" cy="125" r="2.4" fill="#1e2226" stroke="none" stroke-width="0"/>
<text x="588" y="120" font-size="13" text-anchor="start" fill="#1e2226" font-weight="bold">who reads</text>
<text x="588" y="138" font-size="13" text-anchor="start" fill="#1e2226" font-weight="bold">this screen?</text>
<text x="20" y="244" font-size="12" text-anchor="start" fill="#1e2226" font-weight="bold">If the aperture binds the information:</text>
<text x="20" y="261" font-size="12" text-anchor="start" fill="#6b7280">a point holds none, and a wider opening</text>
<text x="20" y="278" font-size="12" text-anchor="start" fill="#6b7280">has no natural boundary</text>
<text x="380" y="244" font-size="12" text-anchor="start" fill="#1e2226" font-weight="bold">If the screen binds it:</text>
<text x="380" y="261" font-size="12" text-anchor="start" fill="#6b7280">its spots still need combining, by another</text>
<text x="380" y="278" font-size="12" text-anchor="start" fill="#6b7280">viewer with an aperture and a screen</text>
</svg>