<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Verdana, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
<title id="t">The camera model of the screen of consciousness, and its regress</title>
<desc id="d">Signals from the four corners of a frame of reference pass through a camera's aperture onto its screen. Reading that screen needs a second camera, whose screen needs a third, and so on without end.</desc>
