<line x1="380" y1="68" x2="380" y2="182" stroke="#1e2226" stroke-width="4" stroke-linecap="butt"/>
<line x1="240" y1="142.75" x2="378" y2="107.25" stroke="#7c5cbf" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9"/>
<circle cx="380" cy="107.25" r="3.2" fill="#7c5cbf" stroke="#ffffff" stroke-width="0.8"/>
<line x1="240" y1="160" x2="378" y2="90" stroke="#d08a2a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.9"/>
