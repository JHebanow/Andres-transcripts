<text x="66" y="76" font-size="12" text-anchor="middle" fill="#6b7280">frame of reference</text>
<line x1="170" y1="62" x2="240" y2="62" stroke="#1e2226" stroke-width="1.4" stroke-linecap="round"/>
<line x1="170" y1="188" x2="240" y2="188" stroke="#1e2226" stroke-width="1.4" stroke-linecap="round"/>
<line x1="170" y1="62" x2="170" y2="119" stroke="#1e2226" stroke-width="2.4" stroke-linecap="butt"/>
