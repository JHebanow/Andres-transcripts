<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" font-family="Georgia, 'DejaVu Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="960" height="790" fill="#FBFAF7"/>
  <text x="480.0" y="38.0" font-size="20" fill="#1a1a1a" text-anchor="middle">The Model of Hierarchical Complexity</text>
  <text x="480.0" y="62.0" font-size="12.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">Commons and Richards&#x27;s stages, as set out in Hanzi Freinacht&#x27;s Metamoderna article</text>
  <text x="246.0" y="118.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">stage</text>
  <text x="470.0" y="118.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">typical performer or age of emergence</text>
  <text x="862.0" y="104.0" font-size="11.5" fill="#6b6b6b" text-anchor="end" font-style="italic">adults</text>
  <text x="862.0" y="118.0" font-size="11.5" fill="#6b6b6b" text-anchor="end" font-style="italic">at stage</text>
  <rect x="196.0" y="642.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="664.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">0</text>
  <text x="246.0" y="664.0" font-size="13" fill="#1a1a1a" text-anchor="start">Calculatory</text>
  <text x="470.0" y="664.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">molecules</text>
  <rect x="196.0" y="608.0" width="694.0" height="34.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/>
  <text x="214.0" y="630.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">1</text>
  <text x="246.0" y="630.0" font-size="13" fill="#1a1a1a" text-anchor="start">Automatic</text>
  <text x="470.0" y="630.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">single cells</text>
  <rect x="196.0" y="574.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="596.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">2</text>
  <text x="246.0" y="596.0" font-size="13" fill="#1a1a1a" text-anchor="start">Sensory or motor</text>
  <text x="470.0" y="596.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">amoeba, mollusks, early fetus</text>
  <rect x="196.0" y="540.0" width="694.0" height="34.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/>
  <text x="214.0" y="562.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">3</text>
  <text x="246.0" y="562.0" font-size="13" fill="#1a1a1a" text-anchor="start">Circular sensory-motor</text>
  <text x="470.0" y="562.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">insects, fish, newborn humans</text>
  <rect x="196.0" y="506.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="528.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">4</text>
  <text x="246.0" y="528.0" font-size="13" fill="#1a1a1a" text-anchor="start">Sensory-motor</text>
  <text x="470.0" y="528.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">rats, young babies</text>
  <rect x="196.0" y="472.0" width="694.0" height="34.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/>
  <text x="214.0" y="494.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">5</text>
  <text x="246.0" y="494.0" font-size="13" fill="#1a1a1a" text-anchor="start">Nominal</text>
  <text x="470.0" y="494.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">pigeons, one-year-olds</text>
  <rect x="196.0" y="438.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="460.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">6</text>
  <text x="246.0" y="460.0" font-size="13" fill="#1a1a1a" text-anchor="start">Sentential</text>
  <text x="470.0" y="460.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">parrots, cats, age two to three</text>
  <rect x="196.0" y="404.0" width="694.0" height="34.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/>
  <text x="214.0" y="426.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">7</text>
  <text x="246.0" y="426.0" font-size="13" fill="#1a1a1a" text-anchor="start">Pre-operational</text>
  <text x="470.0" y="426.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">dogs, age three to five</text>
  <rect x="196.0" y="370.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="392.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">8</text>
  <text x="246.0" y="392.0" font-size="13" fill="#1a1a1a" text-anchor="start">Primary</text>
  <text x="470.0" y="392.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">chimpanzees, age five to seven</text>
  <rect x="196.0" y="336.0" width="694.0" height="34.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/>
  <text x="214.0" y="358.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">9</text>
  <text x="246.0" y="358.0" font-size="13" fill="#1a1a1a" text-anchor="start">Concrete</text>
  <text x="470.0" y="358.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">age seven to eleven</text>
  <rect x="196.0" y="302.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="324.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">10</text>
  <text x="246.0" y="324.0" font-size="13" fill="#1a1a1a" text-anchor="start">Abstract</text>
  <text x="470.0" y="324.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">age eleven to fourteen</text>
  <text x="862.0" y="324.0" font-size="12.5" fill="#1a1a1a" text-anchor="end">~30%</text>
  <rect x="196.0" y="268.0" width="694.0" height="34.0" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/>
  <text x="214.0" y="290.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">11</text>
  <text x="246.0" y="290.0" font-size="13" fill="#1a1a1a" text-anchor="start">Formal</text>
  <text x="470.0" y="290.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">fourteen onward, if at all</text>
  <text x="862.0" y="290.0" font-size="12.5" fill="#1a1a1a" text-anchor="end">~40%</text>
  <rect x="196.0" y="234.0" width="694.0" height="34.0" rx="0" fill="#F1EFEA" stroke="none" stroke-width="1"/>
  <text x="214.0" y="256.0" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">12</text>
  <text x="246.0" y="256.0" font-size="13" fill="#1a1a1a" text-anchor="start">Systematic</text>
  <text x="470.0" y="256.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">eighteen onward, if at all</text>
  <text x="862.0" y="256.0" font-size="12.5" fill="#1a1a1a" text-anchor="end">~20%</text>
  <rect x="196.0" y="200.0" width="694.0" height="34.0" rx="0" fill="#E9E1F2" stroke="none" stroke-width="1"/>
  <text x="214.0" y="222.0" font-size="13" fill="#5B3F86" text-anchor="middle" font-weight="bold">13</text>
  <text x="246.0" y="222.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="bold">Metasystematic</text>
  <text x="470.0" y="222.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">early twenties onward, if at all</text>
  <text x="862.0" y="222.0" font-size="12.5" fill="#1a1a1a" text-anchor="end">~1.5–2%</text>
  <rect x="196.0" y="166.0" width="694.0" height="34.0" rx="0" fill="#E9E1F2" stroke="none" stroke-width="1"/>
  <text x="214.0" y="188.0" font-size="13" fill="#5B3F86" text-anchor="middle" font-weight="bold">14</text>
  <text x="246.0" y="188.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="bold">Paradigmatic</text>
  <text x="470.0" y="188.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">mid-twenties onward, if at all</text>
  <rect x="196.0" y="132.0" width="694.0" height="34.0" rx="0" fill="#E9E1F2" stroke="none" stroke-width="1"/>
  <text x="214.0" y="154.0" font-size="13" fill="#5B3F86" text-anchor="middle" font-weight="bold">15</text>
  <text x="246.0" y="154.0" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="bold">Cross-paradigmatic</text>
  <text x="470.0" y="154.0" font-size="12" fill="#6b6b6b" text-anchor="start" font-style="italic">late twenties onward, if at all</text>
  <text x="34.0" y="118.0" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-style="italic">in Piaget’s terms</text>
  <path d="M 184 509 L 177 509 L 177 673 L 184 673" fill="none" stroke="#56789C" stroke-width="1.3"/>
  <text x="170.0" y="595.0" font-size="12" fill="#56789C" text-anchor="end">sensorimotor</text>
  <path d="M 184 441 L 177 441 L 177 503 L 184 503" fill="none" stroke="#56789C" stroke-width="1.3"/>
  <text x="170.0" y="476.0" font-size="12" fill="#56789C" text-anchor="end">preoperational</text>
  <path d="M 184 339 L 177 339 L 177 435 L 184 435" fill="none" stroke="#56789C" stroke-width="1.3"/>
  <text x="170.0" y="391.0" font-size="12" fill="#56789C" text-anchor="end">concrete</text>
  <path d="M 184 271 L 177 271 L 177 333 L 184 333" fill="none" stroke="#56789C" stroke-width="1.3"/>
  <text x="170.0" y="306.0" font-size="12" fill="#56789C" text-anchor="end">formal</text>
  <path d="M 184 135 L 177 135 L 177 265 L 184 265" fill="none" stroke="#5B3F86" stroke-width="1.3"/>
  <text x="170.0" y="196.5" font-size="12" fill="#5B3F86" text-anchor="end">postformal</text>
  <text x="170.0" y="211.5" font-size="12" fill="#5B3F86" text-anchor="end" font-style="italic">(beyond Piaget)</text>
  <line x1="192.0" y1="234.0" x2="576.5" y2="234.0" stroke="#5B3F86" stroke-width="1.6" stroke-dasharray="7 4"/>
  <rect x="576.5" y="226.0" width="309.5" height="16.0" rx="4" fill="#FBFAF7" stroke="#5B3F86" stroke-width="1.2"/>
  <text x="878.0" y="237.8" font-size="10.5" fill="#5B3F86" text-anchor="end" font-style="italic" textLength="293.5" lengthAdjust="spacing">13 or above needed for real progress in consciousness science</text>
  <text x="480.0" y="730.0" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">Stage 11 is where Piaget&#x27;s original sequence ends. Percentages are Freinacht&#x27;s estimates for a modern adult population. Commons has since</text>
  <text x="480.0" y="745.2" font-size="11.5" fill="#6b6b6b" text-anchor="middle" font-style="italic">defined a stage 16, meta-cross-paradigmatic, not shown.</text>
</svg>
